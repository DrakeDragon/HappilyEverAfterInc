// Wishing Well: free, no ads. 6 wishes stored, 1 refills every 2 hours, each wish = x2 profit for 1 hour (bank up to 24h).
function wishCharges(){
  const w=S.wish,now=Date.now();
  if(w.ch>=WISH_MAX){w.t=now;return w.ch;}
  const k=Math.floor((now-w.t)/WISH_REGEN);
  if(k>0){w.ch=Math.min(WISH_MAX,w.ch+k);w.t=w.ch>=WISH_MAX?now:w.t+k*WISH_REGEN;}
  return w.ch;
}
function wishNextMs(){const w=S.wish;if(wishCharges()>=WISH_MAX)return 0;return Math.max(0,WISH_REGEN-(Date.now()-w.t));}
function wishLeft(){return Math.max(0,S.wish.until-Date.now());}
function addCharge(n){wishCharges();const w=S.wish;if(w.ch>=WISH_MAX)return false;if(w.ch+n>=WISH_MAX)w.t=Date.now();w.ch=Math.min(WISH_MAX,w.ch+n);return true;}
function addBoost(ms){const now=Date.now(),w=S.wish;w.until=Math.min(Math.max(w.until,now)+ms,now+WISH_CAP);_softT=0;}
function castWish(){
  if(wishCharges()<1){toast('No wishes left. The well refills one every 2 hours.');return;}
  const w=S.wish;if(w.ch>=WISH_MAX)w.t=Date.now();
  w.ch--;addBoost(WISH_ADD);S.stat.wishes++;
  toast(`🌠 Wish granted! All profit ×2 for ${dur(wishLeft()/1000)}.`,3800);cat('wish',1,0);sfx('ach');vibe(25);sigs={};updateLive(true);
}
// cached soft multipliers (wish, streak, flash day) so profit() stays fast
let _softT=0,_wm=1,_sm=1,_fl=null;
function refreshSoft(){const now=Date.now();if(now-_softT<500)return;_softT=now;_wm=now<S.wish.until?2:1;_sm=1+0.03*Math.min(streakN(),30);_fl=flash();}
function wishMult(){refreshSoft();return _wm;}
function streakMult(){refreshSoft();return _sm;}
function flashMult(r){refreshSoft();return(_fl.r===-1||_fl.r===r)?_fl.m:1;}

// Daily gift + streak (one missed day is forgiven)
function dayNum(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5);}
function streakN(){const st=S.streak;return(st.last>=0&&dayNum()-st.last<=2)?st.n:0;}
function dailyReady(){return S.streak.last!==dayNum();}
function claimDaily(){
  const d=dayNum(),st=S.streak;if(st.last===d)return;
  st.n=(st.last>=0&&d-st.last<=2)?st.n+1:1;st.last=d;_softT=0;
  const R=S.realms[realm],amt=Math.max(realmPS(realm)*60*15*(1+0.1*st.n),R.cash*0.02,20);
  earn(realm,amt);addCharge(1);
  toast(`🎁 Day ${st.n}! +${REALMS[realm].sym} ${fmt(amt)} and a free wish. Profit ×${fmt(1+0.03*Math.min(st.n,30))} from your streak.`,4800);
  cat('daily',1,0);sfx('big');vibe(30);sigs={};updateLive(true);
}

// Daily quests: three a day, free rewards
const DQ_POOL=[
 {k:'buys',t:'Buy {g} shops',g:[30,60,120]},
 {k:'hires',t:'Hire {g} managers',g:[2,4,6]},
 {k:'ups',t:'Buy {g} upgrades',g:[3,6,10]},
 {k:'guests',t:'Catch {g} guest stars',g:[2,3,5]},
 {k:'twists',t:'Survive {g} Plot Twists',g:[1,2,3]},
 {k:'collects',t:'Tap shops to work {g} times',g:[20,50,100]},
 {k:'wishes',t:'Make {g} wish(es) at the well',g:[1,2,3]},
 {k:'chapReads',t:'Read {g} story chapter(s)',g:[1,1,2]}
];
const DQ_REWARD=['🌠 +1 wish','💰 15 minutes of income','⏳ +30 min of ×2 boost'];
function dqMake(){
  const d=dayNum(),idx=[];let j=0;
  while(idx.length<3&&j<60){const i=Math.floor(rnd(d*7+j*3+1)*DQ_POOL.length);j++;if(idx.indexOf(i)<0)idx.push(i);}
  S.dq={day:d,items:idx.map((i,n)=>{const p=DQ_POOL[i];return {k:p.k,g:p.g[Math.min(2,Math.floor(rnd(d*11+n)*3))],base:S.stat[p.k]||0,done:false,r:n};})};
}
function dqCheck(){if(S.dq.day!==dayNum())dqMake();}
function dqProg(q){return Math.max(0,Math.min(q.g,(S.stat[q.k]||0)-q.base));}
function dqText(q){return DQ_POOL.find(p=>p.k===q.k).t.replace('{g}',q.g);}
function dqClaim(n){
  const q=S.dq.items[n];if(!q||q.done||dqProg(q)<q.g)return;
  q.done=true;S.stat.quests++;
  if(q.r===0){if(!addCharge(1))addBoost(WISH_ADD/2);}
  else if(q.r===1){earn(realm,Math.max(realmPS(realm)*60*15,10));}
  else addBoost(WISH_ADD/2);
  toast('📜 Quest complete! '+DQ_REWARD[q.r]);cat('daily',0.5,0);sfx('ach');sigs={};updateLive(true);
}

// Flash days: a different world is hot each day of the week
const FLASH=[
 {r:-1,n:'Sunday Spectacular',m:1.5,t:'Every world earns ×1.5 today!'},
 {r:0,n:'Pig-Out Monday',m:2,t:'Storybook Forest earns ×2 today!'},
 {r:1,n:'Tea-Time Tuesday',m:2,t:'Wonderland earns ×2 today!'},
 {r:2,n:'Wishful Wednesday',m:2,t:'Arabian Bazaar earns ×2 today!'},
 {r:3,n:'Thrown-Sword Thursday',m:2,t:'Camelot & Sherwood earns ×2 today!'},
 {r:4,n:'Fates-Day Friday',m:2,t:'Olympus Mall earns ×2 today!'},
 {r:5,n:'Snow Day Saturday',m:2,t:'Frostbite Kingdom earns ×2 today!'}
];
function flash(){return FLASH[new Date().getDay()];}

// Story
function checkStory(){
  S.story.seen[0]=1;
  STORY.forEach((c,i)=>{
    if(!S.story.seen[i]&&STORY_COND[i]()){
      S.story.seen[i]=1;
      toast('📖 New chapter unlocked: '+c.t,5000);
      catOffer(c.cat||pickFrom(CAT.story),true);sfx('ach');sigs={};
    }
  });
}
function unreadCh(){let n=0;STORY.forEach((c,i)=>{if(S.story.seen[i]&&!S.story.read[i])n++;});return n;}
function fmtBody(b){return b.split('\n\n').map(p=>'<p>'+p.replace(/\*(.+?)\*/g,'<em>$1</em>')+'</p>').join('');}
function readChapter(i){
  if(!S.story.seen[i])return;
  if(!S.story.read[i]){S.story.read[i]=1;S.stat.chapReads++;}
  const c=STORY[i];
  showModal(`<div class="mtag">CHAPTER ${i+1} OF ${STORY.length}</div><h3>${c.t}</h3><div class="sbody">${fmtBody(c.body)}</div><button onclick="closeStory()">Close the Book</button>`,'story');
  const m=$('modal').querySelector('.mcard');if(m)m.scrollTop=0;
  sigs={};
}
function closeStory(){closeModal();cat('chapterread',1,0);sigs={};updateLive(true);}
function goBook(s){bsub=s;tab='book';sigs={};render();window.scrollTo(0,0);}

// Pills under the header: things worth tapping
function pillsHTML(){
  const p=[],f=flash(),fx=(f.r===-1||f.r===realm);
  if(wishCharges()>=1)p.push(`<span class="pill hot" onclick="goBook('wish')">🌠 ${S.wish.ch} wish${S.wish.ch>1?'es':''}</span>`);
  if(wishLeft()>0)p.push(`<span class="pill" onclick="goBook('wish')">🌟 ×2 · ${dur(wishLeft()/1000)}</span>`);
  if(dailyReady())p.push(`<span class="pill hot" onclick="goBook('wish')">🎁 Daily gift</span>`);
  if(S.dq.items.some((q,n)=>!q.done&&dqProg(q)>=q.g))p.push(`<span class="pill hot" onclick="goBook('wish')">📜 Quest done</span>`);
  if(unreadCh())p.push(`<span class="pill hot" onclick="goBook('story')">📖 New chapter</span>`);
  p.push(`<span class="pill ${fx?'on':''}" onclick="goBook('wish')">⚡ ${f.n}</span>`);
  return p.join('');
}
function storyTabHTML(){
  const rd=Object.keys(S.story.read).length;
  return `<div class="empty" style="padding:4px 6px 12px">“The Last Page of Happily Ever After, Inc.” — a novel in ${STORY.length} chapters, narrated by the Cat. New chapters unlock as you play. Read <b>${rd}/${STORY.length}</b>.</div>`+STORY.map((c,i)=>{
    const seen=S.story.seen[i],read=S.story.read[i];
    if(!seen)return `<div class="item" style="opacity:.6"><div class="ic">🔒</div><div class="tx"><b>Chapter ${i+1}: ???</b><em>${STORY_NEED[i]}</em></div></div>`;
    const words=Math.round(c.body.split(/\s+/).length/100)/10;
    return `<div class="item"><div class="ic">${read?'📗':'📘'}</div><div class="tx"><b>Chapter ${i+1}: ${c.t}${read?'':' <span class="tag on">NEW</span>'}</b><em>${c.s}</em><br><em>~${words}k words</em></div><button onclick="readChapter(${i})">${read?'Reread':'Read'}</button></div>`;
  }).join('');
}
function wishTabHTML(){
  const ch=wishCharges(),pips=Array.from({length:WISH_MAX},(_,k)=>k<ch?'🌠':'⚫').join(' ');
  const nx=wishNextMs(),st=streakN(),f=flash();
  const quests=S.dq.items.map((q,n)=>{const pr=dqProg(q),ok=pr>=q.g;
    return `<div class="item"><div class="ic">📜</div><div class="tx"><b>${dqText(q)}</b><em>Reward: ${DQ_REWARD[q.r]}</em><div class="bar2"><i style="width:${Math.round(pr/q.g*100)}%"></i></div><em>${fmt(pr)} / ${fmt(q.g)}</em></div><button ${q.done||!ok?'disabled':''} onclick="dqClaim(${n})">${q.done?'Done ✓':'Claim'}</button></div>`;}).join('');
  return `<div class="pres" style="margin-bottom:10px"><div class="big">🌠</div><h2>The Wishing Well</h2>
    <p>Toss a coin, make a wish: <b>all profit ×2 for 1 hour</b>. Free. No ads, ever. You hold up to ${WISH_MAX} wishes and get a new one every 2 hours. Boost time stacks up to 24 hours.</p>
    <p style="font-size:20px;letter-spacing:3px">${pips}</p>
    <p>${wishLeft()>0?`Boost active: <b>${dur(wishLeft()/1000)}</b> left`:'No boost active.'}${nx>0?`<br>Next wish in <b>${dur(nx/1000)}</b>`:'<br>Wishes are full! Use one so they keep refilling.'}</p>
    <button class="btn" ${ch<1?'disabled':''} onclick="castWish()">${ch<1?'Out of wishes':'Make a wish'}</button></div>
    <div class="pres" style="margin-bottom:10px"><div class="big">🎁</div><h2>Daily Gift</h2>
    <p>Streak: <b>${st} day${st===1?'':'s'}</b> · all profit ×${fmt(1+0.03*Math.min(st,30))}<br><span style="font-size:11px">Each day in a row adds +3% (up to 30 days). One missed day is forgiven.</span></p>
    <button class="btn" ${dailyReady()?'':'disabled'} onclick="claimDaily()">${dailyReady()?'Collect today\'s gift':'Come back tomorrow'}</button></div>
    <div class="pres" style="margin-bottom:10px;text-align:left"><b style="color:var(--gold)">⚡ ${f.n}</b><p style="margin:6px 0 0">${f.t}</p></div>
    <div style="margin:0 2px 8px;font-weight:800;color:var(--gold)">📜 Today's Quests</div>${quests}`;
}

// ---------- SMOOTH CASH DISPLAY ----------
let dispCash=0,dispRealm=-1,lastF=0;
function frame(now){
  const dt=Math.min(.25,Math.max(0,(now-lastF)/1000));lastF=now;
  const R=S.realms[realm];
  if(dispRealm!==realm){dispRealm=realm;dispCash=R.cash;}
  if(R.cash<=dispCash||R.cash-dispCash<1e-9)dispCash=R.cash;else dispCash+=(R.cash-dispCash)*Math.min(1,dt*10);
  const el=$('cash');if(el&&el.firstChild)el.firstChild.nodeValue=REALMS[realm].sym+' '+fmtC(dispCash)+' ';
  requestAnimationFrame(frame);
}
if(window.requestAnimationFrame)requestAnimationFrame(frame);else setInterval(()=>frame(Date.now()),100);

// ---------- BOOT ----------
load();recalcEV();ACHN=Object.keys(S.ach).length;
(function boot(){
  const away=(Date.now()-S.last)/1000;
  S.opens++;awayStr=away>30?dur(away):'a moment';
  setEventRealm();dqCheck();checkStory();
  if(S.ev.key===0)checkEvent();else if(S.ev.key!==evKey())checkEvent();
  render();
  if(S.migrated){delete S.migrated;S.seen.intro=1;showModal(`<div class="mtag">😸 THE BOOKS HAVE BEEN BALANCED</div><div class="nar">A notice from your narrator</div><p>The numbers were getting out of hand, so I rebalanced the whole economy. Everything starts fresh and slow now, but your guest book and settings were kept. The big numbers are earned the long way from here on.</p><button onclick="closeModal()">Fine. Let's do it properly.</button>`);}
  else if(!S.seen.intro){if(S.lifeAll>0)S.seen.intro=1;else showIntro();}
  if(S.seen.intro)setTimeout(()=>cat('boot',1,0),600);
  if(away>5)offline(away);
  lastT=Date.now();
  setInterval(tick,100);
  setInterval(save,5000);
  setInterval(catClock,8000);setInterval(catPump,500);
  document.addEventListener('pointerdown',()=>{lastAct=Date.now();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){save();}else{tick();}});
  window.addEventListener('pagehide',save);
  document.addEventListener('dblclick',e=>e.preventDefault());
})();
</script>
