const STORY=[];
STORY.push({
t:'Inheritance',
s:'A letter, a key, a bakery that smells like regret, and one very opinionated cat.',
cat:'The first chapter is ready! I wrote it in my head, and then I walked into a wall of text and fell in love. Read it. It has me in it. It has a lot of me in it.',
body:`Let us begin where all good stories begin: with a cat who has been told not to speak.

That is me. I am the cat. You may call me the Cheshire Cat, the Narrator, or "that grinning thing in the corner of the screen who will not stop talking," and I will answer to all three, mostly by grinning harder. I have been asked, in writing, by three separate authorities, to stop narrating. I have thought about it very carefully. I have decided to continue.

So. Hello. Yes, you. The one holding the phone. The one with the thumb. I can see your thumb. It is a good thumb. It is going to do a great deal of tapping in the days to come, and I would like it known that I think it is a hero, and that no one will ever write a song about it.

Here is how this starts.

It starts on an ordinary Tuesday, which in the Storybook Forest means a day that is exactly like the others except that someone has quietly stolen a bridge. You are standing at the end of a lane that is made of gingerbread, though it has been made of gingerbread for so long that nobody finds this strange any more, and you are holding a letter.

The letter is thick. The paper is the cream-colored kind that costs a lot and lasts forever, and the envelope smells faintly of ink, old books, and burnt toast. The handwriting on the front is swooping and urgent and a little bit smug, which is how you know it was written by a relative. The front says, in capital letters that lean forward as if they are trying to get to the end of the sentence before the sentence notices:

TO MY HEIR, WHOEVER YOU TURN OUT TO BE. DO NOT PANIC. (PANIC LATER.)

You turn the envelope over. There is a wax seal. The seal shows a little glass slipper wearing a smaller glass slipper, which is either a family crest or a typo. Inside the envelope there is a key, a deed, and a single sheet of paper. The paper says:

My dear heir,

If you are reading this, then I am gone, and the company is yours. Do not weep. I have never once been gone for good, and I do not intend to start. I have left you the office above the Gingerbread Bakery in the Storybook Forest, a small pile of debts, an enormous pile of responsibility, and a business that is both much more important and much more ridiculous than it looks.

You will have questions. Do not ask the cat. He will answer them. At length. With opinions.

The company is called Happily Ever After, Inc., and its business is the thing that comes after the words "and they lived."

You will understand soon enough. For now, go inside, say hello to the pigs, and whatever you do, do not let anyone print the Last Page.

With all my love and a very small amount of sarcasm,
Hester Oakenshaw
Founder, Chief Executive Officer, and (as of this letter) Missing

You read it twice. Then you read it a third time, because on the third reading the words "Missing" and "Last Page" seem to look back at you. Then you fold the paper very carefully, put it in your pocket, and say to nobody in particular, "Who is Hester Oakenshaw?"

And from the corner of the lane, from a place where the shadows are the exact shade of purple that shadows are not supposed to be, a voice says, "Your great-aunt. A genius. A menace. The only person who ever beat me at croquet. Also: I told you not to ask me anything, and look how quickly you did."

I will tell you what I look like, because I think it is important that you have a picture. I am a cat. A large one, striped, purple and pink, with the sort of grin that arrives before the cat does and stays behind long after. At the moment I am mostly grin. The rest of me is on its way.

"You're the narrator," you say, which is a very intelligent thing to say to a floating grin.

"Was," I say. "I was the narrator. Fourth Wall Division, Department of Stories, Office of the Official Voice. They fired me. Allegedly for editorializing."

"What does that mean?"

"It means," I say, "that I once said a villain was a bit of a bore in front of the villain. It was a true statement. It was in the wrong tense."

I would like you to know that I have not felt sorry about this for a single day.

Anyway. That is how you meet me, and that is how you get your first sight of the office. We walk down the lane together, you in your sensible shoes and me in my mostly-grin, until we come to a crooked little building between a bakery and a bridge-shaped hole in the ground. The sign on the door says HAPPILY EVER AFTER, INC. It is hand-painted. Somebody has tried to fix the "E" with a black marker. The "Happily" is a little faded. A single page of a calendar, stuck to the window, is flapping in a wind that is not there.

You put the key in the lock. It turns. The door opens with a squeak like someone sitting down on a whoopee cushion in a library.

Inside, the office is dark, dusty, and full of paper. There is a desk made of three different kinds of wood, none of which agree with each other. There is a map on the wall that moves, slowly, as though somebody is pushing it around from behind. There is a coat rack shaped like a swan. There is a ledger on the desk, enormous and green and open to a page that says, at the top, in Hester's loopy hand: ASSETS. And below it, a single line:

One (1) Pig.

"One pig?" you say.

"It's a start," I say. "She always said you should begin with something small. The universe likes small things. It underestimates them."

The pig is standing on the desk. He is not a large pig. He wears an apron and a hat, and in one hoof he holds a tiny, very serious trowel. He looks at you with the weary patience of someone who has seen many bosses and been impressed by none of them.

"You're the new owner," he says.

"I... guess?"

"I'm Bernard," says the pig. "Brick-Layer Bernard. Three Little Pigs Construction. Division of one. I'd shake your hand but I'd have to put down the trowel, and I've had it since the wolf."

"Which wolf?"

Bernard and I exchange a look. It is the look of two beings who have a lot of history and have agreed not to bring it up at parties.

"The wolf," says Bernard. "There's only one that matters."

Now, here is the part where I stop being charming and become useful, because you are going to need me. Let me explain the business.

Every story in the world ends the same way. Not literally the same, of course. Some stories end in a wedding, some in a feast, some in a small, quiet, satisfying cough. But somewhere in the last line of every tale ever told there is a little phrase that nobody looks at twice. It says: and they lived happily ever after.

Think about that. Ever after. Forever, after. A real, honest-to-goodness, never-ending time that begins the moment the book closes. Where does it happen? Who organizes it? Who pays the pigs? Who makes sure that Cinderella gets a ride home when the carriage turns back into a pumpkin, or that the Seven Dwarfs have a dental plan?

Someone has to. Somebody has to run the Ever After. And for a very long time, that somebody was your great-aunt.

The Ever After is not magic, you see. It is a lot like a small business: it needs shops and managers and supply chains and lunch. It needs people to build the houses that the wolf blows down (and people to rebuild them), and people to bake the bread that the Gingerbread Man outruns, and people to run the tower salons, the ferry lines, the porridge diners. It is all just work. Lovely, ridiculous, pun-laden work. But if no one does it, the Ever After is empty, and a story that ends in emptiness is not a happy story. It is just a story that stops.

That is where Happily Ever After, Inc. comes in. We are the ones who make sure that "ever after" is an actual, functioning place. We run the businesses that keep the characters busy, fed, housed, and mostly out of trouble. We take a little bit of every transaction. We reinvest it in more shops, more jobs, more happily. And as the company grows, the Ever After grows with it, until one day (says Hester, in the margin of the ledger) "the whole thing is so full of life that nobody could ever write 'The End' again with a straight face."

"Sounds nice," you say.

"It's nice," I say. "It's also a great deal of paperwork."

It is time, I think, for you to begin. There is a button in the ledger, a modest one, which says WORK. I'd like you to press it. (If you are reading this in the real world, I mean the little round thing on the first shop on your screen. Tap it. Go on. I'll wait. I'm a cat. Waiting is what I do between naps.)

Bernard sets down his trowel. He picks up a brick. He lays it on a second brick, and then a third. There is a small chime, like a spoon on a glass, and a single gold coin rolls out from under the desk and stops at your shoe.

"That's it," says Bernard. "That's revenue. That's the whole thing. Do it again."

You do it again. Another coin. Another brick. Somewhere, in the walls of the office, something sighs with relief, as though a very old clock has been wound for the first time in years.

"Is that... all?" you ask.

"For today," I say. "Tomorrow there will be more. And the day after. That's the beauty of it. You do a small thing, the small thing makes a little money, and the little money makes another small thing. Eventually it all gets very big, and very silly, and numbers begin to have letters in them."

"Letters?"

"You'll see. You'll see. They start with K."

Now, because I am a responsible narrator (I am not, but I would like to be seen as one), I should warn you that there is a shadow over all of this. It is the sort of shadow that does not belong to anything, and it stands in the corner of the office, a little taller than the coat rack, a little thinner than the door. When you first walked in, you did not notice it. Now that you have earned a coin, it has leaned in ever so slightly, as though a very large pair of scissors is deciding where to cut.

I notice. I am a cat. We notice everything, and then we pretend we did not.

"What's that?" you ask, pointing at the shadow.

"Nothing," I say, very fast.

"Cat."

"A draft," I say. "From the door. Which is open. Bernard, shut the door."

Bernard shuts the door. The shadow stays where it is.

"Right," I say. "Chapter one. We're done. Go and make money. Press the buttons. Hire the pigs. Let me deal with the draft. And whatever you do, do not, under any circumstances, let anyone from the Editor's Office through the front door."

"What's the Editor's Office?"

"I'm sorry," I say, "I'm going to need you to stop asking questions. Look, a coin!"

You look. There is, in fact, a coin. You pick it up. When you look back at the corner, the shadow has gone, and the draft has gone with it, and the office is quiet except for the soft tapping of a pig building a house of bricks out of nothing but patience.

I let myself disappear, slowly, grin last, the way I always do. But before I go, I say to the empty room, to the dust, to the ledger, and to you:

"Happily Ever After, Inc. Open for business. Let's see how long we can keep the story going."

And from the back of the ledger, very faintly, in the margin, a line of Hester's handwriting appears and fades again like breath on glass:

*Not long enough. Never long enough. Keep going.*

End of Chapter One. (It is not the end. I'm contractually forbidden from using that word. I'm saying it for effect. Please do not tell the Editor.)`
});

STORY.push({
t:'Three Little Pigs, One Large Lawsuit',
s:'The wolf wants to sue. The pigs want to build. The mail wants to be opened, but it is full of red ink.',
cat:'Chapter two! Pigs. Wolf. Lawsuits. Mild red ink. I\'m in it for roughly eight paragraphs, which is a personal record. Read it before the red ink gets to it first.',
body:`The first thing you learn about running a business in the Ever After is that everybody has a lawyer and nobody can afford one.

The second thing you learn is that the wolf has two.

You discover this on your third day, when a very large, very polite envelope arrives at the office addressed to HAPPILY EVER AFTER, INC. (ATTN: THE NEW PERSON). It is the color of old teeth. It is stamped, in blue ink, with the words "HUFF & PUFF, LLP: Representing Wolves, Big and Bad, Since Before The Houses Fell." Inside is a letter, three pages long, that begins with the words "WHEREAS" and ends with a small drawing of a smiling, cartoonish, but legally binding paw print.

Bernard reads the letter over your shoulder, which is a challenge for a pig of his height. He has to stand on a stack of Hester's old ledgers.

"Oh no," he says.

"What does it say?"

"It says the wolf is suing."

"Suing us? For what?"

"For breathing."

"For breathing?"

"For breathing on his house," Bernard clarifies. He pushes his hat back and rubs his forehead with the hand that is not holding the trowel. "He says we broke the code of the story. In the original text, he gets to huff and puff and blow the house down. We've built a house that he can't blow down. He says that's tampering with his job."

I am sitting on the desk, grinning at a stack of tax forms. I would like it entered into the record that I am not involved in this conversation and have no opinion about it whatsoever. I have five or six.

"Is that legal?" you ask.

"It's the Ever After," says Bernard. "Everything is legal if you say it with enough confidence."

"I'd like to point out," I say, "that the Big Bad Wolf's lawyers are, in fact, two other wolves in a trench coat. They have never lost a case. They have also never won a case. It's all a matter of how long you can keep a person on hold."

"So what do we do?"

Bernard takes a deep breath. It is the breath of a pig who has built three houses and had two of them blown away by his brothers' mistakes. He looks at the wall, at the map that is slowly rearranging itself, and at the small gold coin you have been using as a paperweight.

"We do what we always do," he says. "We build."

Now, I must pause here, because I am about to explain the central mechanic of the Ever After, and I do not want you to nod off, so I will use a metaphor. Imagine a sandwich.

No, not a sandwich. A pig.

Every business in the Ever After works the same way. You buy a shop. The shop makes money, slowly, every time the characters inside it do their work. You hire a manager to run the shop so that you do not have to tap it yourself. You buy upgrades to make the shop better. You buy another shop. The shops make more money. Eventually the pigs build a hundred houses, and the hundred houses pay for a hundred more, and the whole thing grows like a bean in a very ambitious sky.

That is the economy. That is the whole game. It is simple, and it is a little bit magical, and if you do it right, you will find that your thumb has a rhythm. Tap, buy, tap, hire, tap, upgrade. Pretty soon you won't even have to look. (There's a button at the bottom of the screen that says Buy All. It is the single most honest button in the Ever After. Press it often. Press it with feeling.)

So you do what Bernard says. You build.

By the end of the afternoon you have bought a second pig, who is named Percy and who does not wear a hat because he lost it in a bet with a gust of wind. You have also bought a third pig, a quiet one, named Pat, who speaks only in rhyming couplets and is obviously a poet. Between the three of them, Three Little Pigs Construction is now a functioning business that makes bricks, builds houses, and pays a reasonable salary in coins, hay, and one slightly stale cookie.

At sundown, a shadow falls across the front step. It is not the shadow from the corner. This is a much bigger shadow, and it has a tail.

The wolf has come to deliver his complaint in person.

"Good evening," says the wolf. He is enormous. He is wearing a three-piece suit made of what appears to be several smaller, sadder suits stitched together. He holds a briefcase in one paw and a small pink umbrella in the other, which is not at all menacing, which is the point. "I am the Big Bad Wolf. I believe you have been served."

"We have," says Bernard.

"I will be brief," says the wolf. "I am a proud professional. I have huffed. I have puffed. I have blown down houses of straw and houses of sticks and, on one regrettable occasion, a house of paperwork. My record is spotless. And now I am told that there is a pig on the outskirts of my territory who is building houses of such quality that they cannot be blown down. Do you know what this does to my reputation?"

"Makes you look bad?" you say.

"Makes me look redundant," says the wolf, and for a moment the polite mask slips, and I see the thing underneath it, the thing I have seen in every villain who has ever stood on a doorstep and wondered whether he is still needed. It is not rage. It is fear. It is the fear of being the person at the party who does not know anybody. "I do not want to stop huffing. I just want to be useful."

There is a long silence. The map on the wall stops moving, as if it is listening.

And then Pat the poet, who has never spoken above a whisper, says:

"Why don't you try to be a brick? Why don't you try to be a stick?"

"Pat," says Bernard, "that doesn't even rhyme."

"It does if you try," says Pat.

"I'm a wolf," says the wolf.

"We know," you say. And an idea arrives, as ideas do when you are tired and hungry and slightly outnumbered. "How do you feel about insurance?"

The wolf blinks. "Insurance?"

"A house that can't be blown down is a house that's safe," you say, thinking out loud. "But a house that can be blown down, and that gets rebuilt for free, is a house with a guarantee. People would pay for that. People would pay for peace of mind. People would pay for a promise that if something goes wrong, someone will show up, with a trowel, and fix it. And they'd need somebody to... assess the risk."

"A risk assessor," says the wolf, slowly.

"A very scary, very professional risk assessor," you say. "Somebody who walks around, huffs a bit, and says, 'Yes. This one would fall.' Somebody who knows what a house can take."

The wolf's ears go up. His tail goes up. His umbrella goes up, entirely by accident, and the little pink canopy blossoms above his head like a flower.

"Huff & Puff Insurance," he says, in a hushed voice, as if it is the name of a distant, shining city.

"Underwritten by Three Little Pigs Construction," says Bernard, with the air of a pig who has just discovered he is a genius.

"I will want my own office," says the wolf.

"You can have the one with the draft," you say, and I say, "Wonderful, I was getting tired of it," and the wolf steps into the office and sits in the chair the shadow used to stand beside, and the shadow, which has been hovering in the corner, slides slowly out through the keyhole.

You do not notice. I do. I am a cat. I notice everything, remember?

The next morning, something strange happens.

You come downstairs and find Bernard standing in front of the front door, staring at a plaque that Hester hung there years ago. It's a small brass plate with the pigs' company motto engraved on it. It says, or it said, until yesterday:

"Not by the hair of my chinny-chin-chin!"

Now it says:

"Not by the ▮▮▮▮ of my chinny-chin-chin!"

"Someone's scratched it out," says Bernard.

"Someone's *redacted* it," I say, and I am not smiling. That should tell you something. I smile at funerals.

"What does that mean?" you ask.

"It means," I say, "that the line is gone. Not erased. Gone. Removed from the story as though it was never there. Look at the plaque. You can see where the brass has been cut away, a clean line, one word long. Whoever did it was careful. And thorough. And very, very quiet."

Bernard touches the little black rectangle with the tip of his trowel. For a moment, he looks very small.

"What's a hair?" he says. "What's a chinny-chin-chin? I know I used to know."

I have never felt so cold in my life. And I live in a place where the weather is made of rumor.

The mail arrives at noon. Among the usual bills, birthday cards, and a letter from the Sheriff of Nottingham asking whether you've seen his taxes, there is a single envelope that is not like the others. It is long and thin and the color of a fresh bruise. It has a stamp on it that is shaped like a tiny pair of scissors.

You open it.

Inside is a notice, printed on very good paper, in very good ink, in a very good font:

NOTICE OF REVIEW
To: Happily Ever After, Inc.
From: The Office of Final Draft & Associates
Re: Your Story

Dear Sir or Madam,

It has come to our attention that a small enterprise has been operating in the Storybook Forest in violation of Narrative Conventions Sections 4 through 12.

Your story is under review.

We will be in touch.

Yours in concision,
Mr. Margin
Junior Clerk, Department of Corrections

P.S. We are sorry for any inconvenience. We are always sorry. It is what we do.

You read it twice. Then you read it a third time. Then you look at me.

"I told you," I say, softly, "not to let anyone from the Editor's Office through the front door."

"We didn't," you say.

"No," I say. "They didn't need the door."

I lick my paw. It is a nervous habit. I do not like it when you see me do it.

"All right," I say, as brightly as I can manage, "here is what we are going to do. We are going to keep building. We are going to keep earning. We are going to make so much money, and so many jobs, and so many characters with so many lines to say, that no pair of scissors in the world will be able to find the end of the thread. We are going to make Happily Ever After, Inc. the biggest, loudest, silliest, most necessary company in the entire Ever After. And when the Editor comes knocking, we're going to open the door, and we're going to say: 'Sorry, we're in the middle of something.'"

"That's your plan?" you say.

"It's the oldest plan in the book," I say. "It's the plan every good story has ever had."

"Which is?"

"Don't stop."

You look at Bernard. Bernard looks at the plaque. Pat the poet looks at the floor and, very quietly, begins to recite a rhyme to fill the gap in the motto, and Percy joins in, and then Bernard does, too, and by the time they have finished it is something like a prayer, and something like a promise, and something very like a song.

Somewhere in the walls, the old clock ticks. A single coin rolls out of the dark and rattles across the floor. A pig builds a brick.

The story goes on.

End of Chapter Two. You may now tap your thumb in a defiant manner. I recommend the left one.`
});

STORY.push({
t:'The Gingerbread Audit',
s:'A very polite clerk arrives with a very sharp pencil. Everyone is nervous. The cookies are terrified.',
cat:'You just crossed a million. This chapter has a talking cookie and a clerk with a red pen. I\'m sorry in advance. Not about the cookie. The cookie is wonderful.',
body:`There is an old saying in the Ever After: when the first million coins arrive, so does the first auditor.

I do not know who said it. I think I just made it up. But it is true, and it is the first time in your career that you will experience the particular chill of opening your front door to a man holding a clipboard.

The man at the door is small. Not short, exactly, but narrow, as if somebody had pressed him flat between two pages of a heavy book and then given him a suit. He is pale and neat and has the careful, apologetic posture of someone who has been told his whole life to take up less room. He wears round spectacles and a pale grey waistcoat with a single red thread running down the seam. In one hand he holds a clipboard. In the other, he holds a pencil.

It is not a normal pencil. The eraser is the wrong color. It is red, bright red, and as sharp as a blade.

"Good morning," he says. His voice is soft and polite, like a teacup being set gently on a saucer. "I'm so sorry to trouble you. My name is Mr. Margin. I am a Junior Clerk in the Department of Corrections at Final Draft & Associates. I believe you received my letter?"

"The Notice of Review," you say.

"Yes," says Mr. Margin, and he looks almost relieved, as though he had been afraid you would shut the door. "I'm sorry about the tone. It's a form letter. I did try to soften it. I added a postscript."

"You apologized in a postscript."

"It's the only part of the letter I'm allowed to write," says Mr. Margin.

I am sitting on the windowsill, grinning, because grinning is what I do when I am afraid, and I am extremely afraid. I know exactly what the pencil does. I have seen it do it. Not to me; I was fired, which is a far gentler fate. But I have seen it, in the dark rooms of the Department of Stories, strike a line through a character's name and watch the character fade, pixel by pixel, like breath on glass.

"May I come in?" asks Mr. Margin.

"No," I say.

"Yes," you say, at the same time, because you are polite, and polite people are very difficult to protect.

Mr. Margin steps over the threshold with the smallest of nods. He is the sort of person who apologizes to doorframes. He moves through your office with his clipboard held in front of him like a shield, peering into corners, squinting at shelves, writing quietly in a small, neat hand. He is careful not to touch anything. He is careful not to breathe on anything. He is, in short, the most thorough and harmless-looking monster you have ever seen.

"Tell me," he says. "Who is in charge of the Gingerbread Express Sneakers division?"

"We don't have one," you say.

"Ah," says Mr. Margin. He looks genuinely disappointed. "That's a pity. I was so looking forward to it."

"What's the Gingerbread Express?" you ask me, out of the side of your mouth.

"A cookie with a business plan," I whisper. "Quick as a sneeze. Ran away from an old woman, an old man, a cow, a horse, and a fox. Never been caught. Not once. Famous for it."

"And?"

"Fox got him in the end," I say. "In the original story. Ate him right up."

"Oh."

"But we are, in this office, better than the original story," I say, and I raise my voice for Mr. Margin's benefit. "Aren't we?"

"I can't comment on that," says Mr. Margin.

The audit takes the better part of the day. Mr. Margin sits at Hester's desk with a stack of ledgers and a pot of tea that Bernard has made for him (Bernard cannot help it; he is a kind pig). He asks about your income. He asks about your expenses. He asks, delicately, whether the Three Little Pigs have been "paid appropriately for narrative labor," and when Percy begins to answer in a very long speech about hay, Mr. Margin writes down the word "hay" and underlines it once.

Then, at about half past three, a small, golden, extremely fast cookie bursts through the front door.

"Run, run!" shrieks the cookie. "Run as fast as you can! They're here!"

It is the Gingerbread Man. He is about the size of your hand, brown and shiny and slightly burned on one foot. He is wearing a tiny pair of running shoes and a tiny, determined face. He skids across the floorboards, spins twice, and comes to a stop on top of Mr. Margin's clipboard.

"You can't catch me!" the cookie yells, his gumdrop buttons quivering. "I'm the Gingerbread Man!"

"I know," says Mr. Margin, and for the first time, his voice breaks a little. "I... I know. I read about you when I was small."

The Gingerbread Man freezes. A single raisin eye widens.

"You did?"

"I read you under the covers, with a torch," says Mr. Margin. "I loved you. You were so fast. I always wanted to be fast. I never was."

Nobody moves. The clock ticks. The tea goes cold.

Then Mr. Margin straightens, and takes a deep breath, and raises his pencil.

"I'm so sorry," he says. "I truly am."

And the pencil comes down.

I have to tell you what happens next, and I have to tell it carefully, because it is the first time you see the Red Pen at work, and I do not want you to be scared. I want you to be angry. Anger is a much better emotion for a hero. It keeps you moving.

The pencil does not touch the cookie. It touches the air above the cookie, and where it touches, a thin, bright, red line appears, as if the air itself is paper. The line is perfectly straight. It passes through the Gingerbread Man like a ruler through a puddle. And where it passes, he flickers. His gumdrop buttons go dim. His raisin eyes lose a little of their shine. His little shoes begin to fade at the toes, the color draining out of them like tea from a bag.

"I can't catch you," whispers Mr. Margin, "so I'll catch up with you."

"What are you doing?" you shout.

"My job," says Mr. Margin, and he is crying now, quietly, behind his round glasses. "It's an old story. It has too many loose ends. It runs and runs and never stops. It never learns a lesson. It never settles down. It is, I'm sorry, a continuity error."

"He's a cookie!" says Bernard. "He's a person!"

"He's a recurring character with no clear arc," says Mr. Margin. "Do you know how many versions of him there are? Hundreds. Thousands. Some of them end well. Some of them end badly. Some of them end in the middle of a sentence. It isn't fair to him. He doesn't know which one he is. We're trying to... to give him a single, final, tidy ending."

"He doesn't want an ending," says the cookie, in a very small, flickering voice. "He wants to run."

And that is when I remember something I have been trying very hard to forget.

I remember the moment I was fired. I remember the Editor's office, long and white and cold, with a desk the size of a skating rink, and the long, thin woman sitting behind it, and the red pen in her hand. I remember the question she asked me. It was: "Do you not think it would be kinder, for everybody involved, if the story simply stopped?"

I said no. I said stories do not stop. I said they only rest.

She said, "That is a very pretty thought."

I said, "I'm a very pretty cat."

She said, "You're fired."

I do not tell you any of this, because it is not yet time. But I remember it, and the remembering gives me an idea.

"Hit the button," I say.

"What button?"

"The one in your pocket," I say. "The one Hester left you. The one in the ledger. The one marked CONTINUE."

You reach into your pocket and find nothing. And then you remember, with that strange dream-clarity that comes only at the edge of a story, that there is a little round button at the bottom of your ledger, and it has been there since the first day, and it is labeled, in tiny gold letters: WORK.

You press it.

That is all it takes.

The Gingerbread Man, who has been fading, gasps. His buttons flash. His shoes flare bright as a struck match. The light of work and wages and ordinary labor pours through him like a river. For a long moment he is the most real thing in the room.

"I have a job," he gasps. "I... I have a job! I run deliveries! I am a Gingerbread Express!"

"You are," says Bernard, who is nearly in tears.

"I have an arc!" says the Gingerbread Man.

"You have several," says Percy.

"I have a purpose!" cries the cookie, and as he cries it, the red line across his body flickers, and thins, and breaks, like thread pulled too hard.

Mr. Margin stares at the pencil in his hand. It is trembling.

"That should not have worked," he says, very quietly. "A story needs a reason to continue. A reason. A function. If a character has a purpose, if the world needs him, if he has a place in the economy..."

"Then he is not a loose end," you say. "He's a thread."

Mr. Margin sits back down. He looks at you for a long time. And then he does something that I have never seen a clerk of the Red Pen do. He puts the pencil on the desk, carefully, point down, so it cannot do any more harm.

"I can't undo what's been done," he says. "But I can... I can write that the audit was inconclusive. It's the only thing in my power. It will buy you time."

"How much time?"

"A few weeks. A month, maybe. Dame Strike reads my reports on the first of each quarter."

"Dame Strike?"

Mr. Margin goes, if possible, even paler.

"I shouldn't have said that."

"Who's Dame Strike?" you say.

And Mr. Margin, reaching for his coat, answers in a voice so small that even I, with my cat's ears, can barely catch it:

"She's the one who decides how things end."

He takes his clipboard, his pencil, his dignity, and his sorrow. He bows to Bernard, who has not stopped sniffing, and to the Gingerbread Man, who is already doing laps around the ledger, and to you. He pauses at the door.

"For what it's worth," he says, "I loved the cookie. I always did."

"We know," you say.

"It's not an excuse."

"No," you say, "but it's something."

He goes. The door closes behind him with the small, sad click of a thing that wishes it could stay open.

I come down off the windowsill. The office is silent. The Gingerbread Man has fallen asleep on the ledger, curled around a single gold coin like a cat.

"You're shaking," you say, to me.

"I'm not," I say. "It's the cold."

"It's July."

"It's a cold July," I say.

You pick up the fallen letter from the floor. On the back of it, in letters so small you almost miss them, Mr. Margin has written a single line in pencil, a different pencil, one that does not glow red. It says:

*Be careful. She is not what you think. She was not always like this.*

You read it, and look up at me. I do not meet your eyes.

"Cat," you say.

"Yes?"

"Who is Dame Strike?"

I sit down. I curl my tail around my paws. The grin fades, bit by bit, until there is nothing left of my face but my eyes, and they are older than you thought.

"Tomorrow," I say.

"Cat."

"Tomorrow," I say again, gently. "I promise. Tonight, let the cookie sleep. Let the pigs sing. Let the numbers go up. We'll need every coin we can get. There is a long road ahead, and a very short pencil behind it."

A single coin rolls in the dark. A brick settles. Somewhere, far away, in a very white and very cold office, a long, thin woman looks up from her desk and says, to nobody:

"Hmm."

End of Chapter Three. If you are reading this at a normal pace, you have just spent about nine minutes in a cookie's company. That is, scientifically, more than most of us deserve.`
});

STORY.push({
t:'Down the Rabbit Hole, Slightly Late',
s:'A hat, a hare, a very long table, and a clock that has been stuck at six o\'clock for far too long.',
cat:'You\'ve opened a new world! Wonderland! I have history there. I have a LOT of history there. Please read the chapter before I start telling you the history in a worse way.',
body:`I promised you an answer, and I always keep my promises, except the ones I forget, which are most of them. This one I remembered.

The woman's name is Dame Vellum Strike. She is the Chief Editor of Final Draft & Associates. She is tall and thin and white-haired, and she has the posture of a person who has never once been slouched upon. She wears a long coat the color of fresh paper, with cuffs the color of blood, and when she walks, you can hear a quiet, rhythmic sound behind her, like a page turning every second step.

She is not, as villains go, a loud one. She does not rage, or cackle, or twirl anything. She simply decides. And the thing she has decided is that the stories of the world should be finished.

"Finished?" you ask.

"Closed," I say. "Sealed. Printed. Done. No more sequels, no more retellings, no more reboots, no more 'what if the wolf was misunderstood' or 'what if Cinderella was a vampire.' A single, perfect version of every story, locked in a book, forever. She calls it the Final Edition."

"That doesn't sound so bad," you say.

"Doesn't it?" I say. "It sounds lovely. That's the trouble."

We are standing at the edge of a hole. It is a very large hole, in the middle of a very green lawn, on the far side of the Storybook Forest, and it has a sign next to it that reads, in extremely friendly letters: WONDERLAND: NEXT RIGHT. NO REFUNDS.

The ledger in your pocket has begun to hum. It is the sound of a very old thing being asked to do a very new thing. The cost of entry, you discovered this morning, is one billion gold coins, paid in full, and when the last coin left your hands you felt, for the first time, the vertigo of owning something enormous. The hole yawns. The air above it smells of tea and peppermint and rain on a hot street.

"Is there a trick to this?" you say.

"You fall," I say. "That's the trick. The trick is to fall like you mean to land."

"I do not like falling."

"Nobody does," I say. "But you do it anyway. That is the essence of business."

And I push you in.

Now, I'd like to apologize for pushing you, and I'd like to point out that it was for your own good, and I'd like to remind you that I am a cat and therefore constitutionally unable to be blamed. The fall is long. The walls of the hole are lined with shelves, and the shelves are lined with jars, and the jars are all labelled ORANGE MARMALADE, except that when you look closer, they are empty. A grandfather clock passes you on its way up. A rabbit in a waistcoat passes you on its way down. A teapot passes you sideways, and a small voice inside it says, "Pardon me."

You land in a heap of cushions, which is rude of the cushions, because you were quite ready for a hard landing and were looking forward to being brave.

Wonderland does not look like what you expect. The sky is the wrong color, which is to say that it is a perfectly good color, but not one that sky is usually allowed to be. The trees have faces. The flowers have opinions. In the distance, on a hill, there is a long table covered with a long white cloth, and sitting at the table are three figures who do not appear to have moved in a very long time.

"There," I say, appearing beside you, grin first. "That is our first stop. That is the Mad Hatter's tea party."

"Is it always tea time?" you say.

"It's always six o'clock," I say. "There's a difference. One of them is a time of day. The other is a prison."

You walk up the hill. The grass squeaks underfoot. The table stretches out ahead, covered with teapots, cups, saucers, jam, butter, and a single slice of cake that has been in the same state of "just about to be cut" for what may be centuries.

At the head of the table sits the Hatter. He is wearing a hat that is larger than he is, and a green coat that is smaller than he is, and an expression of such perfect, polite exhaustion that you want to give him a nap. At his left is the March Hare, who is vibrating gently, and on his right is the Dormouse, who is asleep in a teapot.

"Good morning," says the Hatter. "Or evening. It's six."

"Hello," you say. "I'm from Happily Ever After, Inc. We're, um, a company. We'd like to open a branch."

"A branch," says the Hatter, in the tone of someone saying "a tooth." "Of what?"

"Business," you say.

"Is that a kind of tea?" says the March Hare.

"It's a kind of everything," I say, and appear on the table, in the middle of the jam. "Hello, Hatter. Hello, Hare. Hello, Dormouse, if you're in there."

The Dormouse says, from inside the teapot, "Zzz... Cheshire?"

"The very same."

"You've lost weight."

"I've lost a job," I say. "It's not the same thing."

The Hatter stares at me for a long time. Then he takes off his enormous hat, and underneath it his hair is as grey as a cobweb, and he says, very quietly, "We thought you were dead."

"Not dead," I say. "Just edited."

I have not told you what happened here. I will, now. But I'd like you to sit down. There is a chair at the table. It is yours. It has been waiting for you, in the way that chairs wait for the person who will finally sit in them.

Once upon a time, the Mad Hatter's tea party was a place where time ran in the usual direction. There were mornings. There were afternoons. There were, on occasion, the bits in between where people forgot what time it was and ate cake. The tea party was a lovely, silly, ongoing argument between friends. It had a rhythm. It had a start and, in a sense, a middle, and in a loose way, the promise of an end. (Everyone expected that eventually somebody would get up and say, "Well, I'd better be going," and the party would break up, and they would all go home.)

Then one day, a woman came to the table, and sat down, and took out a long red pen.

She did not say anything. She just looked at them. She looked for a long time. And then she reached out, and drew a line through the one person at the table who was not at the table.

"Time," says the Hatter. "She cut Time."

"Time?" you say.

"Mister Time," says the March Hare. "Tall fellow. Pocket watch. Terrible singer. We'd quarrelled with him once, over a song, and he had stopped speaking to us, but he was still ours, you see. He was still part of the party. He was still..."

"Out there," says the Hatter, waving his hand at the sky. "Somewhere."

"And she crossed him out."

"With a red pen, in a single line."

"And now," says the Hatter, "it is always six o'clock."

I can feel you looking at me, but I am looking at the cake. It is a lemon sponge, I believe. It has a little sugar flower on top, which has been about to fall off for a hundred and fifty years.

"But that's the thing," I say. "That's the thing that's so funny. She wanted to end the party. She wanted to give it a tidy, final stop. She struck out the one person whose job was to keep things moving, and what happened?"

"The party never ended," you say.

"The party never ended," I say. "It's been going for years. The tea is cold, and the cake is stale, and everyone is miserable, but it has not ended. It cannot end. She has tried everything. She has cut cups. She has cut sugar. She has cut the March Hare's left ear, which is why he vibrates, by the way. But she cannot finish this story. You can't end a thing that is stuck in the middle of itself."

"Because it's already unfinished," you say.

"Because it's already unfinished," I say, and I am grinning, I am grinning from ear to ear, and then from ear to ear again, and then in a few other places for good measure. "Do you see? Do you see what it means? She has a weakness. She can end anything that is nearly over. She can cut anything with a loose thread, and anything that is willing to be tidy. But a story that has no ending, a story that refuses to be a story, a story like a tea party that goes on and on, she cannot touch. It's like trying to erase a circle."

"So we keep the party going?"

"We do better than that," I say. "We *restart the clock*."

Now, this is the part of the chapter where you are going to be tempted to think I am joking. I am not. I never joke about clocks. They are the only thing in the universe I respect.

"Hatter," you say. "How much would it cost to bring Mr. Time back?"

"Back?" says the Hatter. "He's not lost, my dear. He's merely *redacted*. There is a difference. A lost thing is out there, somewhere. A redacted thing is in here, but blackened. If you wanted him back, you would have to fill in the blank. You would have to... pay."

"Pay what?"

The March Hare lowers his voice. "Time is money," he whispers.

"Everyone says that," says the Hatter, rubbing his forehead. "Nobody ever asks what the exchange rate is."

"Twelve minutes of tea," says the March Hare, "per gold coin."

"That's not even a thing," says the Dormouse, from the teapot.

"It is now," says the Hatter.

And that is how Happily Ever After, Inc. enters Wonderland: with a deal made over cold tea. You will invest in the party. You will buy it a clock (a good one, a generous one, a clock with opinions). You will open shops all around the table, tea stalls and hat boutiques and a Queen of Hearts HR department, because the Queen of Hearts is no longer a queen, in the sense that she is out of work, and has been out of work since the Red Pen took away her head-chopping budget. ("I just want to chop something," she weeps, in the doorway, and Bernard, who has followed you down the rabbit hole with a tray of bricks, gives her a spade and points at a flowerbed.)

You will meet the White Rabbit, who is late. You will meet the Caterpillar, who is relaxed. You will meet Tweedledum and Tweedledee, who are lawyers, which explains a great deal. You will meet a pool of tears, a garden of living cards, and a caucus race. You will do all of this by tapping the screen with a single thumb, a tiny movement that generates a river of Teacups, which is the currency of this strange, sideways land.

And you will look for Alice.

"Where is she?" you ask the Hatter, as the first teacups begin to roll across the table. "Alice. The girl. I thought she'd be here."

The Hatter's face does something complicated.

"She grew up," he says.

"People do."

"Not here," says the Hatter. "Not in Wonderland. Nobody grows up in Wonderland. That's the point. It's a place where it's always too early and always too late, where nobody gets older and everybody gets wiser, and where a girl can fall down a hole and become the most important person in the world for an afternoon. But Alice... Alice went home. She went home, and she got older. And when she got older, she forgot."

"Forgot what?"

"Us," says the Hatter. "And when people forget a story, the story gets thinner. It's easier to cross out, if it's thin. She was the thread. She was the one thing that held the whole of Wonderland together. And when she let go..."

"Dame Strike moved in," I say.

The Hatter nods. The March Hare nods. The Dormouse nods so hard that he wakes up for a second and says "What did I miss?"

"Cake," says the Hatter. "As usual."

I see you looking at me. I know that look. It is the look of someone who has just been handed a map with half the pieces missing. You say, very gently, "Cat. How do you know what she's like?"

"Because," I say, "I was the one who showed her the way."

"What?"

"I was her Narrator," I say. "Her very first. Years and years ago. Before the Red Pen. Before the Final Edition. Before she was Dame Vellum Strike, Chief Editor, she was just Vellum. A girl with a lamp and a stack of books. And I was the voice in her head that read them aloud."

The Hatter closes his eyes.

"I didn't know," says the Hatter.

"No one did," I say. "It's not the sort of thing you put on a business card."

For a moment, none of us say anything. The teapot hisses. The cake waits to be cut.

And then the sky, which has been the wrong color for a very long time, shivers. A single, tiny sound travels across the tablecloth, a sound you have not heard in this place for ages. It is the tick of a clock. It is the very first tick, a single, uncertain beat, like the heart of a bird.

"Was that..." says the March Hare.

"Mister Time," says the Hatter.

Tick.

"He's not back," I say. "But he's *listening*."

Tick.

The Dormouse sits up in his teapot. The March Hare stops vibrating. The Hatter puts on his enormous hat. And somewhere, deep in the ground beneath your feet, a very large and very old pocket watch begins to unwind.

You smile. You cannot help it. The first tea party in a hundred years is about to begin. And you, a person with a ledger, a thumb, and a missing great-aunt, have just made the single most important discovery in the entire history of the Ever After:

The Editor is afraid of unfinished business.

So let's give her plenty.

End of Chapter Four. (Not the End. A comma.)`
});

t:'The Ending Business',
s:'You close the books, keep the shoe, and meet the woman with the pen. She is not what you pictured. That\'s worse.',
cat:'Your first Happily Ever After! You reset the whole empire on purpose. The game calls that progress. I call it extremely brave. Chapter five has the Editor in it. Brace your thumb.',
body:`There is a particular sound that a business makes when it is about to end. It is a soft sound, a bit like a sigh, and a bit like a coat being taken off a hook. Nobody hears it unless they are listening. I have been listening for years.

You hear it on a Thursday, in the middle of Wonderland, in a tea shop that was nothing but a hole in the ground a month ago. Teacups are rolling down the counters. The March Hare is running the till. The Hatter has put up a sign that says NEW HATS EVERY HOUR (BUT THEY'RE ALL THE SAME HAT). The Queen of Hearts has been promoted to Regional Director of People Operations and is very, very happy, though a little too much so, and the Caterpillar has just announced a line of mushroom-scented candles. It is going well. It is going so well, in fact, that you have begun to feel a strange, quiet pressure in your chest, like a whole company leaning against a door that wants to open from the other side.

"It's time," says a voice.

It is not my voice. It is a soft, silvery, faintly impatient voice, the voice of a woman who has done this many times, and who is mildly sorry you have not.

You turn. Standing in the doorway of the tea shop, with a sparkling wand tucked behind one ear and a set of keys on her belt, is a short, round, sparkly lady in a sensible grey dress. She has a shining, rather tired face. She has wings, but they are folded and a little crumpled, like a coat that has been sat on. She has a pencil behind her other ear. And she is wearing, you notice with some surprise, a name tag that says: FAIRY GODMOTHER (FRANCHISE #1).

"Hello, dear," she says. "I'm here for the closing."

"The what?"

"The ending," she says gently. "You've done very well. Better than I expected. A million coins in a month, a billion in a season, an entire world opened up... I'm very proud. But a business like yours can only grow so large before it gets too heavy. Do you know what happens to a story that gets too heavy?"

"It breaks?"

"It *rests*," she says. "That's the whole secret of the Ever After. It isn't about getting bigger and bigger until you burst. It's about getting as big as you can, and then closing the book on it with a smile. And then, when you are ready, opening a new one. We call it a Happily Ever After."

I'm sitting on the counter, licking a teacup, and I'd like to say that I am not eavesdropping, but I am, and I am taking notes.

"You mean I have to give it all up?" you say.

"Of course not," says the Fairy Godmother. "You give up the *gold*. The shops. The managers. The inventory. All the things that were temporary. You keep what is real."

"Which is?"

She smiles. She reaches into her pocket. And she takes out a shoe.

It is a very small shoe. It is made of glass, as clear as a dewdrop, and it catches the light in a hundred tiny, trembling rainbows. It is warm to the touch. It hums, ever so quietly, like a seashell held to your ear. When she places it in your hand, you feel something go through you like a bell, and a long way off, in the back of your head, you hear a faint, familiar voice say:

*There you are. I was wondering when you'd come.*

"Hester?" you whisper.

The Fairy Godmother does not seem surprised. "She's in all of them, dear," she says. "Every Glass Slipper. A little bit of her. She poured herself into the first thousand before she went missing. It was her way of leaving notes."

You hold the slipper against your chest. It is not much bigger than your palm. And yet there is a weight to it, an ancient, patient, hopeful weight, like a promise made a very long time ago by someone who knew you before you were born.

"What does it do?" you ask.

"It remembers," says the Fairy Godmother. "Every Happily Ever After you live, you earn a slipper. It's a kind of receipt for a good ending. The more of them you collect, the more the Ever After remembers you, and the better it treats you the next time around. Your shops make a little more. Your workers work a little harder. The story *likes* you, if that makes sense."

"And what happens to the rest?" you say. "The gold? The shops?"

"They go back to the beginning," says the Fairy Godmother. "But *you* don't. You go back to the beginning with a slipper in your pocket and a whole lot of practice. It's the oldest trick in the book. It's the trick that keeps the world going. Every ending is a beginning, if you wear the right shoes."

"It's a reset," you say.

"It's a *Happily Ever After*," says the Fairy Godmother, and she looks genuinely hurt. "A reset is what happens to a clock. This is what happens to a heart."

You'd think that this is the part where I jump in with a joke. I'd like to. I cannot. I am too busy looking at the door.

You see, if you are a cat, you know when something has stopped moving. And something, outside the tea shop, has stopped moving. The caterpillars, the rabbits, the flamingos, the cards. All of it. The entire street has gone perfectly, absolutely, terrifyingly still.

"Oh no," says the Fairy Godmother, very quietly. "She's early."

And the door opens, and in comes a draft, and in the draft comes a woman.

If you have been picturing a monster, or a witch, or a tyrant, I'm afraid I have to disappoint you. Dame Vellum Strike is none of those things. She is tall and straight and thin, with hair as white as a blank page, and a face that is very still and very calm and very, very tired. She wears a pale coat with red cuffs. She wears glasses that are perched on the end of her nose. She carries a long, silver-barrelled pen, and she carries it the way a nurse carries a thermometer: with care, and without malice, and with the quiet certainty that she is about to cause someone discomfort for their own good.

"Good afternoon," she says. Her voice is like a page being turned. "I'm so sorry to intrude. I understand there's been some kind of ceremony."

"We were just..." you say.

"I know what you were doing," says Dame Strike. She does not sound angry. She sounds almost kind. "You were closing the books. You were taking a small and perfectly reasonable ending and calling it a new beginning. It is what your great-aunt always did. It is a very beautiful lie."

"It isn't a lie."

"It's an *incomplete sentence*," says Dame Strike. "You cannot start again without ending. You cannot end without finishing. And you cannot finish without stopping. And you, my dear, do not know how to stop."

She sits down at the table, without being asked, in the chair beside the Hatter. The Hatter has gone grey. The Dormouse has gone into the teapot and pulled the lid shut behind him. The March Hare has begun to vibrate so hard that his chair is making a little rattling noise.

"Hello, Vellum," I say.

She does not look at me. But the pen stops moving in her hand.

"Hello, Cheshire."

"You look well."

"I look tired," she says. "It's the work."

"It always was."

For a moment, something passes between us, something that has been waiting a very long time to be said. And then it is gone, as quick as a smile on a cat, and she is looking at you again, and her gaze is a clear, calm, unbearable blue.

"I have come to make you an offer," she says.

"I don't want it," you say.

"You haven't heard it yet."

"I don't want it anyway."

"That," says Dame Strike, with a very small, very sad smile, "is exactly what your great-aunt said."

She puts her pen on the table. She clasps her hands. And she says, in the gentlest voice in the world:

"I am going to print the Last Page. Not tomorrow. Not next year. But soon. When it is done, every story will be finished, and every character will have an ending, and every ending will be happy. Do you understand what that means? No more Wolves. No more Witches. No more poison apples or evil stepmothers or hundred-year sleeps. No more pain. No more *plot*. Every tale will be tidy and complete. The sun will rise on a world in which nothing has to go wrong ever again."

"And nothing will ever change," you say.

"Nothing will *need* to."

"It sounds like a museum."

"It sounds like peace," says Dame Strike.

The tea shop is silent. A teacup rocks on the table, once, twice, and falls still. The Fairy Godmother has her hand on your shoulder. I can feel her wings trembling against my fur.

"Here is my offer," says Dame Strike. "Sell me your company. The deed, the ledger, the keys. In exchange, I will give every single one of your employees, every pig, every cookie, every hatter and rabbit and gentle old queen, a perfect, permanent, happy ending. A cottage by the sea. Warm tea. A garden. A life without fear. They will not have to work again. They will not have to wonder. They will not have to run, or hide, or hope, or fail. They will simply be."

And here is the thing. The thing I have never, in all my nine lives, been able to explain. She means it.

She is not lying. She is not tricking. She is offering you the most beautiful thing she knows how to give, and she is offering it with her whole, tired, aching heart.

You look at Bernard, who is hiding behind a teapot. You look at the Gingerbread Man, who has curled into a ball on the table. You look at the Hatter, who is holding his hat to his chest. You look at the small, shining shoe in your hand, and you feel the faint, warm hum of someone who might be listening.

"No," you say.

"No?"

"I don't want them to simply be," you say. "I want them to *happen*. I want the pigs to argue. I want the cookie to run. I want the Hatter to be wrong about the time. I want the Queen to shout and the Rabbit to be late and the Dormouse to fall asleep in the soup. I want things to go wrong, and I want people to fix them. I want a world where there's always something left to do."

Dame Strike looks at you for a long time. The pen lies still between her fingers.

"Everyone says that," she says, finally. "At first."

"And?"

"And then they get tired," says Dame Strike. "Everyone does. In the end, everyone does."

She stands. She smooths her coat. She picks up her pen and tucks it into her sleeve. For a moment, I think she will say something else. Then she turns to me, and her face changes, just slightly, like a page in a light wind.

"You should not have come back," she says. "Either of you. There are things in this world that are better left unwritten."

"That," I say, "is a very Editor thing to say."

"It is a very *kind* thing to say," says Dame Strike, and she is gone, as if she had never been.

The street begins to move again. The caterpillars wriggle. The flamingos squawk. The cards shuffle in their garden. The Hatter lets out a breath that has been waiting since the Industrial Revolution. And on the floor, where Dame Strike's chair was, there is a single sheet of paper, folded in half.

You open it. It is a letter, written in a handsome, upright hand:

*FINAL NOTICE.
You have until the Press is ready.
When it begins to hum, I will begin to print.
I would very much prefer that you were not here to see it.
V.S.*

"The Press?" you say.

"A long story," I say, "and a cold one."

"Cat."

"I know," I say. "Next chapter. I promise."

"Cat."

"What?"

"Are you all right?"

I look at my paws. They are not shaking. That is how I know I am not all right. A cat who is truly calm is a cat who is lying.

"I'm fine," I say. "I'm just... a little bit edited."

You hold the slipper in your hand. It has stopped humming, but not entirely. There is still a breath of warmth in it, a low, steady glow, a whisper of a voice that says, for your ears alone:

*You did the right thing. Now do it again. And again. And again.*

The Fairy Godmother claps her hands. "Well!" she says. "That's the closing ceremony! Shall we begin?"

You nod.

She raises her wand. A great, bright, silver-white light fills the tea shop, the table, the world, and the last thing you see before it takes you is the Hatter, raising a teacup in a trembling hand and saying, softly, in the voice of a person who has just realized he is not alone:

"To be continued."

End of Chapter Five. (If you are playing along, congratulations: you have lived Happily Ever After for the very first time. Please note that nobody told you the shoe would be so heavy. I'm sorry. I should have said.)`
});

STORY.push({
t:'One Thousand and One Nights of Cash Flow',
s:'A storyteller who refuses to finish. A genie who won\'t stop consulting. A Sultan who really loves a tax.',
cat:'Arabian Bazaar unlocked! Camels, lamps, spice, and the greatest storyteller of all time. I\'m very jealous. Read it before I get petty.',
body:`There are three things you should never do in the Arabian Bazaar. You should never ask a camel its opinion. You should never rub a lamp without reading the terms and conditions. And you should never, under any circumstances, interrupt a storyteller in the middle of a sentence.

You do all three before lunch.

The Bazaar is not like Wonderland, or the Storybook Forest, or anywhere else you've been. It is hot and bright and loud and smells of cinnamon, cardamom, roasted nuts, and strong coffee. The streets twist and fold like the pages of a book. The sky is the blue of a sapphire. Everyone is shouting. Everything is for sale. And at every corner, someone is telling a story.

"It is a place," I say, riding on your shoulder like a very smug parrot, "where every sentence is a currency, and every pause is a loan. Mind your wallet. Mind your wit. And mind the carpet, it's looking at you."

The carpet is looking at you. It is hanging on a rope above a stall, and it has two small, tasseled eyes, and when you walk beneath it, it drops six inches and hovers, quivering, as if it wants something.

"It wants a job," says the vendor, a round man with a bright orange turban and a smile like a sunrise. "It's been trying to get hired for a hundred years. It's afraid of heights."

"It's a flying carpet," you say.

"Yes," says the vendor sadly.

You hire the carpet. It is a good decision. The carpet cries a little. The vendor cries a little. You make a note in the ledger: FLYING CARPET AIRLINES: ONE (1) CARPET, ONE (1) STAFF MEMBER, ONE (1) SEVERE PHOBIA. By the end of the week it will have a staff of four, a pilot's license, and a small but loyal base of passengers who prefer not to look down.

That is how business works in the Bazaar. It is built on small kindnesses and enormous tax bills.

"Speaking of which," I say, as you walk past a pillared building with a golden dome. "That is the Sultan's Tax Department. If you see a man in a purple robe with a bureaucratic expression and a very large abacus, run."

"Why?"

"Because he's the Vizier," I say. "Jaffar-ish. We call him that because nobody has ever quite pinned down his name, and he gets upset when they try. He has a secret. He loves collecting taxes. He has a hobby of finding new ones. Last month he introduced a tax on the tax on the tax. Citizens appreciate the symmetry."

"That sounds terrible."

"It's the best-run economy in the Ever After," I say. "He's very good at it."

At the center of the Bazaar there is a plaza paved with colored stone, and at the center of the plaza there is a fountain, and sitting on the edge of the fountain is a woman in a deep blue robe, with long dark hair and a pair of eyes that look as though they have seen the end of every story ever told and found it wanting.

She is telling a story to a crowd. You cannot hear what she is saying from where you stand, but you can see it on their faces. They are leaning forward. They are holding their breath. A little boy at the front has forgotten to close his mouth, and a small bird has landed in it, and neither of them has noticed.

"That," I whisper, "is Scheherazade."

You have heard the name. Everybody has. You know the story, or the shape of it: a king who married a new bride every day and had her executed in the morning, a clever young woman who volunteered to be next, and a very long tale, told over a thousand and one nights, that kept her alive by stopping, every dawn, at the most exciting part.

"She never ended it," you say.

"She never *ended* it," I say. "She ended each night. She never ended the *story*. That is the whole trick. Every morning the king said, 'I'll kill you after I hear what happens next,' and every morning she said, 'Ah, but what happens next is tomorrow's tale.' It's a perfect system. It's the most efficient survival strategy in the history of literature. And it works because..."

"People can't stand not knowing," you say.

"People can't stand not knowing," I say. "Not even kings. Not even Editors."

Scheherazade finishes her tale. The crowd lets out a long, shaky sigh. A hundred hands reach for their purses, and a hundred coins patter into a copper bowl. The little boy swallows the bird (not literally, it flew away), and Scheherazade looks up and sees you, and sees me, and smiles a small, tired, immensely knowing smile.

"Ah," she says. "The cat."

"Scheherazade," I say.

"And you must be the heir."

"I am?" you say. "I mean, yes. I am."

"Sit," she says. "I have been waiting for you. Not you in particular. Somebody. For about a thousand and one nights."

You sit on the edge of the fountain. The water is cool against your back. A genie in a green waistcoat is polishing the fountain's brass spout with a rag, humming to himself, and in a stall nearby a monkey in a tiny fez is counting coins with extraordinary precision.

"I have heard about Dame Strike," says Scheherazade, without being asked. "The Editor. She came to see me too."

"What did she say?"

"She asked me to finish the story."

"And?"

"I said I would, if she'd tell me how it ends."

"Did she?"

"She said it ends with everyone happy," says Scheherazade. "I said, that's not an ending, that's a mood."

I laugh. I laugh so hard that I fall off your shoulder and into the fountain. The genie fishes me out with a net, without looking up.

"The Editor can't touch me," says Scheherazade. She says it simply, the way a person says the sky is above them. "She has tried. She has sent clerks and notices and one very persuasive letter. But my story has no ending. It has only nights. And each night ends on a question. And a question, my dear, is the only thing in the world that cannot be redacted."

"Why not?"

"Because a question is not a statement," says Scheherazade. "It's an open door. You can cross out an answer. You can't cross out a *wondering*."

You think about the tea party in Wonderland, and the tick of a clock, and the way the Hatter said *to be continued*. A cold, clear idea rises in your mind like a bubble in a pot.

"That's the weakness," you say. "That's what she's afraid of."

"Not afraid, exactly," says Scheherazade. "She is *tired*. She has read every story. She knows how they end. She has seen the hundred million ways a wolf can eat a girl and a dragon can eat a prince and a poison can eat a queen. She wants it to stop. Not because she is cruel, but because she is *kind*. You see? That is the trouble. It is always the kind ones."

I would like to say something clever. I do not. I just sit in the sun with my fur dripping and think about a woman with a pen who once read a book to a cat.

"I have something for you," says Scheherazade.

She reaches into her robe and takes out a small brass lamp. It is not a fancy lamp. It is dented, and scratched, and has a wad of old cloth stuffed in the spout. She puts it in your hand.

"Is it magic?" you ask.

"Everything is magic," says Scheherazade. "This one is also *useful*."

The genie in the green waistcoat has stopped polishing. He is staring at the lamp with an expression of deep, profound, painfully familiar fatigue.

"No," he says. "Not again."

"It's only a consultation," says Scheherazade.

"It's always only a consultation," says the genie. "It starts with 'I'd like a small favor' and ends with 'could you also rebuild the pyramids.'"

"I haven't asked for anything," you say.

"You haven't *rubbed* anything yet," says the genie, and sighs. He floats up out of the fountain and turns a lazy somersault in the air, shedding sparkles like a wet dog. His name, you learn, is Intern Genie (Unpaid), and he works for Genie Wish Consulting, which is a division of the Bazaar's Department of Dreams. He is blue. He is very tired. He has been a genie for three thousand years and has yet to receive a single raise.

"Here's how it works," he says. "You get three wishes. You use the first one on something silly. You use the second one on something expensive. You use the third one to undo the first two. Every single time. Every single customer. I could set my watch by it, if I had a watch. They never let me have a watch."

"What if I used the three wishes carefully?" you ask.

"Nobody does," says the genie.

"What if I didn't use them at all?"

The genie blinks. "That's... not allowed."

"It's not *forbidden*," says Scheherazade.

"It's a loophole," says the genie.

"It's a *grey area*," says Scheherazade. "A wish unmade. A wish held in reserve. A wish that is always about to be spent, but never is. Do you understand? The Editor can erase a wish that's been granted. She can cross out a happy ending. But she cannot touch a wish that is still waiting. A promise that is still pending. A possibility."

"A cliffhanger," you say.

"A cliffhanger," says Scheherazade, and her eyes shine. "The oldest, strongest, most beautiful clause in the entire Ever After. We call it the Cliffhanger Clause. It says: as long as there is one thing left to find out, no one may cut the story short."

Now, I'd like to stop here for a moment, because I have realized something, and it is the kind of thing that makes a narrator feel suddenly very exposed.

You may have noticed that every chapter of this story ends with something unfinished. A door left ajar. A line trailing off. A promise that I'll explain it all tomorrow. I'd like to tell you that is a coincidence. It is not. It is Scheherazade's Law, and it has been the law of storytellers since the first fire. It's also, now that I think about it, the entire structure of the game you're playing. The upgrade you're saving for. The next shop. The next chapter. The next number with the next letter. You are never quite done. There is always just a little further to go. That isn't a trick, dear reader. That's the point.

That's what keeps the story alive.

"I'd like to hire you," you say to Scheherazade.

"Hire me?"

"To tell stories. Here. In the Bazaar. Streaming, nightly, in installments. I'll set up a platform. You tell the tale, and every night I'll... I'll sell the next chapter."

"Subscriptions," says the genie, aghast.

"Subscriptions," you say.

"Cliffhanger Carl will be thrilled," says the genie. "He's been unemployed since the invention of the paperback."

And thus begins Scheherazade Streaming, a division of Happily Ever After, Inc., the first and only entertainment company in the history of the Bazaar whose product is, quite literally, the question "What happens next?" It will make you a fortune. It will keep a thousand storytellers employed. And it will, in time, become one of the most valuable weapons in your war against the Red Pen.

You rise from the fountain. Your robes are damp. Your thumb is tired. The ledger in your pocket is heavy with Dinars, a currency the color of sunset, and the air is thick with spices and possibility.

"One more thing," says Scheherazade.

"Yes?"

"The Editor does not hate stories," she says. "She hates *endings that hurt*. She is not wrong about that. A good number of them do. She has simply gone about it the wrong way."

"How would you go about it?" you ask.

"I wouldn't stop the story," she says. "I'd make sure the next chapter was kinder."

I am not crying. A cat does not cry. I am merely wet from the fountain, and there is something in my eye, and it is a sand grain, and you will not mention it.

The sun begins to set over the Bazaar. The lamps come on, one by one, until the whole city glows like the inside of a jewel. In the distance, a camel sings. A carpet takes flight. A monkey counts coins. And somewhere beyond the minarets, on the far horizon, past the dunes and the dust and the edge of the map, something white and cold and very, very high begins to glitter.

"What's that?" you ask.

"Not yet," says Scheherazade. "Ask me tomorrow."

You laugh. You cannot help it. The whole thing is such a beautiful, ridiculous, maddening trick. And you realize, with a strange, bright joy, that you are going to be asking *tomorrow* for the rest of your life.

End of Chapter Six. To be continued, as they say. And I say it extremely loudly.`
});
