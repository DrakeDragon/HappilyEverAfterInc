STORY.push({
t:'The Press',
s:'Twenty-five slippers in, the Cat finally explains the machine that is going to end everything.',
cat:'Twenty-five Glass Slippers! That is a lot of shoes for someone who claims to have only two feet. This chapter explains the Press. Sit down. Put down the snack. Okay, keep the snack.',
body:`I told you I would explain the Press. I'm going to do it properly, which means I'm going to do it badly, because the truth about the Press is that nobody has ever explained it well. It is the sort of thing you have to see, and the sort of thing you hope you never do.

So here is what I'm going to do. I'm going to take you there.

You do not want to go. I know. I have watched you for seven chapters, and I have learned your face, and right now your face is saying, "Cat, I have a Gingerbread Man to feed and a carpet to calm and a very specific number of Glass Slippers that I would like to see increase." That is fine. That is all lovely. But a good manager looks at the competition, and the competition is a building, and the building is on the other side of the next page.

Turn the page, then. Go on. I'll wait.

...

You turned it. Good. There is a building.

It sits at the end of a long white road, on a plain of flat grey stone, under a sky the color of an unwritten letter. It is very tall. It is very clean. It has no windows, which is the first thing you notice, and it has no doors, which is the second, and the third thing you notice is the sound. It is a deep, patient, humming sound, a low note held for so long that your teeth begin to hum along with it.

"This is Final Draft & Associates," I say. "Headquarters. Also known as the Press."

"Where's the entrance?" you ask.

"There isn't one," I say. "You don't enter the Press. The Press enters you."

I want you to know that I am only being dramatic about half the time. The other half is just accuracy.

We walk up to the wall. It is not stone, up close. It is paper. Thousands upon thousands of sheets of paper, pressed together so tightly that the seams have vanished, like the layers of a mountain. And on each sheet, in tiny, neat, upright handwriting, there is a single word.

THE END.

THE END. THE END. THE END. Over and over, floor to roof, wall to wall. It makes your eyes ache. It makes your throat close.

"These are the finished stories," I say. "Every tale she has completed. Every one with a stamp."

You reach out and touch the wall. It is warm. And inside it, very faintly, you can feel a heartbeat, hundreds of heartbeats, all sleeping.

"Are they alive?" you whisper.

"They're *done*," I say. "It's a different thing."

A line of figures is moving along the base of the wall. They are small and grey and silent, each one carrying a stack of paper almost as tall as itself. They have no faces, only smooth pale ovals where the faces ought to be, and they walk with the neat, tidy steps of beings who have never once been late.

"Clerks," I say. "Used to be characters. Minor ones. Third Guard. Fourth Villager. Second Mouse on the Left. The kind of people who have one line and a hat. When a story is finished, the Press takes all the extras and turns them into staff. They get a desk. They get a pension. They get peace."

"They get *erased*," you say.

"They get *promoted*," I say, and then I stop, because I can hear how it sounds, and I hate that I can hear it.

One of the clerks stops walking. Its faceless head turns, slowly, toward us. It holds out a sheet of paper. On it, in the tidy hand, is written one sentence:

*Would you like to apply?*

You shake your head, very slowly, and the clerk bows and moves on, and I discover that I have been holding my breath for the better part of a minute, which is a feat for a cat, who does not generally need to.

"How does it work?" you ask. "The Press. What does it actually *do*?"

"It prints," I say. "It has a plate for every story that has ever been told. You know how a printing press works? Ink goes on the plate. The plate goes on the paper. The paper comes out the same, over and over, a thousand identical copies."

"So?"

"So imagine the plate is Cinderella. And imagine that every time anyone, anywhere, anyhow, tells the story of Cinderella, the Press makes them tell it *exactly like the plate*. Same dress. Same pumpkin. Same shoe. Same midnight. No variations. No twists. No retellings. No stepsisters who turn out to be nice."

"That's... a lot of control."

"It is *all* the control," I say. "And here is the trouble. When she first built it, it was a library. A Great Archive. Every story in the world, carefully preserved, so that nothing could ever be lost. That was the idea. *Preserve* everything. Keep it safe. You must understand, dear reader, that she built this place out of love."

I say it quietly, and I say it to the wall.

"What happened?" you ask.

"Stories change," I say. "That's what they do. You tell a story one way on Tuesday and a different way on Friday. Some people think that's the beauty of it. And some people see it as a kind of... leak. A slow loss of the original. Every time a story changes, a bit of the first version fades. She watched it happen. She watched Cinderella lose her cinders. She watched the Wolf grow soft. She watched the sad endings get softened and the happy endings get complicated, and the more she tried to hold on to the true version, the faster it slipped away."

"So she built a machine to hold it still."

"She built a machine to hold *everything* still," I say. "And it works. That's the horror of it. It works beautifully. Every month it gets a little bigger. Every month a few more stories go into the wall."

The humming grows louder. The ground trembles. And at the very top of the building, a thousand feet above us, a single light turns from white to pale gold.

"What's that?" you say.

"That," I say, "is the Press warming up."

This is the moment where I would normally make a joke. I have one ready. It is about printer ink. It is a good joke. It has been in my pocket for three hundred pages. But the light is turning, and the hum is rising, and a small voice inside the Glass Slipper in your pocket has started to whisper something, something over and over, and you take it out and hold it to your ear.

*Not yet. Not yet. Not yet.*

"Hester," you say.

*Keep going,* says the voice. It is fainter than before. It sounds like someone speaking through a wall. *Every slipper you collect is a stitch. Every stitch holds a piece of the story open. If you can gather enough of them, you can wedge the plate. You can jam the Press. But you have to be quick. She is almost done.*

"How many?" you whisper. "How many do I need?"

*A great many. I'm sorry. I did try to make it fewer.*

You almost laugh. It is the most Hester thing you have ever heard.

In your hand, the slipper glows. You look down at it, and you notice that it is no longer alone. Your pocket is crowded. Twenty-five of them, and each one is warm, and each one is humming a different note, and together they sound like a very quiet choir.

"It's a chord," you say.

"It's a *defense*," I say. "The slippers are not a prize. They are a resistance. Every one is a small, stubborn proof that a story can end and then keep going. Each one is a thumb in the dyke. And you have twenty-five."

"Is that enough?"

"No," I say. "But it's a lot better than none."

The light at the top of the Press flickers. The humming steadies. The grey clerks continue their silent march. And from somewhere inside the wall comes a faint, muffled sound, a sound you will remember for the rest of your life, a tiny, muffled voice saying, through a thousand layers of paper:

"Is someone there?"

You press your ear against the wall.

"Is someone out there?" says the voice. "It's very quiet in here."

"Who are you?" you ask.

"I'm the Second Mouse on the Left," says the voice. "I used to have a line. I can't remember it."

I cannot tell you how I feel at this moment. I have been many things in my life: a narrator, a ghost, a nuisance, a cat. I have never been the sort of creature who feels *responsible*. But I am looking at this wall, and I am listening to this mouse, and I am thinking about the word *preserve*, and I am thinking that it is possible to love a thing so much that you suffocate it.

"We'll get you out," you say.

"Out?" says the mouse. "Is there an *out*?"

"There will be," you say. "I promise."

And I want to tell you, here at the end of this chapter, that I did not cry, and that the shaking in my whiskers was only the hum of the Press, and that the thing in my eye was the dust from the wall. But I have a rule about lying to you, which is that I only do it when it is funny.

This is not funny.

So: I was very moved. There. I said it. Now please stop looking at me and go buy something.

End of Chapter Seven. (The mouse remembers his line later. It's "Squeak." It's a good line. He was just out of practice.)`
});

STORY.push({
t:'Fifty-Two Weeks of Trouble',
s:'A year-keeper with a very big calendar, a festival that changes every week, and the first stamp that actually means something.',
cat:'Event stamps! The Calendar Keeper has noticed you. The Calendar Keeper notices everyone eventually. It is the worst thing about her and the best thing about her. Chapter eight.',
body:`Here is a fact about the Ever After that nobody tells you at orientation. It has a calendar.

I don't mean a regular one, with days and months and a picture of a kitten that gets less interesting from March onward. I mean a *real* one. A structure. A great, glittering, interlocking wheel with fifty-two spokes, one for every week of the year, and each spoke is a different world. Seven days long. Open to the public. Limited time only.

"Welcome," says a voice behind you, "to the Festival Year."

You turn. Standing at the top of a staircase made of folded days is a tall, cheerful, rather rumpled woman wearing a long coat covered in pockets. Each pocket has a little paper tag. Each tag has a date. She has a pencil in her hair, three pencils behind her ears, and a fourth in her mouth, which she removes in order to speak.

"I'm Calla," she says. "Calla Dar. Calendar Keeper, Weeks Division. You must be the Founder. I have been *dying* to meet you. You have no idea how much paperwork you've generated."

"I've generated paperwork?"

"Every time you finish a festival week, I get a form," says Calla. "In triplicate. It's *thrilling*."

I would like to point out, for the record, that I like her immediately. She is the only person in the entire Ever After who has ever been genuinely excited about paperwork, and in a world that contains a Queen of Hearts and a Sultan's Vizier, that is saying something.

"Here's the thing," says Calla, leading us down the stairs. "Every week, a different corner of the Ever After throws a festival. We've had the Gingerbread Games. The Great Beanstalk Bake-Off. The Midnight Masquerade. The Pumpkin Regatta, where eighteen carriages race across a lake, and the only rule is that none of them can be a pumpkin by morning. Each festival has its own economy. Its own rules. Its own rewards. A week long, and then it's gone. Whoosh."

"Gone where?" you ask.

"Back into the wheel," says Calla. "It'll come around again next year."

She opens a pocket, and a little paper festival unfolds in her palm: a tiny town, a tiny crowd, tiny fireworks the size of dandelion seeds. It sparkles for a moment, and then she folds it up and tucks it away.

"Now, here's why it matters," she says. "Each festival you finish earns you a Stamp. Bronze, silver, gold. A little record of what you did that week. And the Stamps, my friend, are the only thing in the entire Ever After that the Press cannot erase."

I perk up. This is new. I have been in this business for a very long time, and I did not know that.

"Why not?" you ask.

"Because a stamp is a *memory*," says Calla, "and a memory isn't a story. It's a fact. The Press can edit a tale. It can't edit what happened. You went to the Gingerbread Games. You won a silver. That *occurred*. It's in the past, and the past is the one thing nobody gets to rewrite."

She stops in front of a great wooden door covered in dates. She taps it with her pencil.

"The Editor hates it," she says, almost fondly. "She sends me a memo every Monday. 'Please stop recording things as they happen.' I've kept every one of them. They go in the pocket marked Complaints."

And now I am grinning. And now I am laughing, a small, delighted, snuffling laugh, because I have just realized that all this time, while the Editor was building her enormous machine, the one thing she had no answer for was a woman with a pencil and a pocket and a deep, abiding love of the word *Tuesday*.

"So what do I do?" you ask.

"You play," says Calla. "That's all anyone can do. Every week, a new festival opens. You jump in. You earn what you can. And at the end of the week, whatever you earn goes into the Year Bank, and the whole Ever After benefits. Not just you. *Everyone*. A bit of extra profit for every shop in every realm. It's a thing we call the Stamp Dividend. It's tiny, at first. But it adds up."

"Why would the whole world benefit from my festival?"

"Because that's what a festival is," says Calla. "A thing that belongs to everybody."

She opens the door.

I cannot describe the room on the other side. It is a ballroom, and a marketplace, and a library, and a stadium, and a garden, all at once, and there are thousands of people in it, characters from every story you know and a hundred you don't, all talking at once, all laughing, all carrying plates of food. There are banners on the ceiling, and each banner is a different week. The Week of the Dancing Shoes. The Week of the Seven Dwarfs' Strike. The Week the Moon Fell in the Well. A week for the Frog Prince's Wedding, a week for the Great Stew Disaster, and one that simply says WEEK 31: NOBODY KNOWS WHAT THIS ONE IS, GOOD LUCK.

"This is the Archive of Weeks," says Calla. "Every festival that ever was. Every one that ever will be. And the best part, the part I'm most proud of..."

She leads you to a great glass case in the center of the room. Inside it, resting on a velvet cushion, there is a book. It is a plain book, with a plain cover, and it is open to a blank page.

"This is the Year Book," she says. "The only unedited account of the Ever After. Every single day is recorded. Every day, someone makes an entry. And the Editor can't touch it, because the entries are all in the *present tense*."

"What does that mean?"

"She can only erase things that are done," says Calla. "She's a past-tense creature. Everything she touches becomes 'was.' But the Year Book is always 'is.' Today, the pigs *are* arguing. Today, the Hatter *is* wrong. Today, the cat *is* showing off."

"I am not showing off," I say.

"The cat is showing off," writes Calla, in the margin, and a little line of ink appears on the page.

I pretend to be offended. I am not offended. I am, in fact, delighted. Because when you are the narrator of a story, you spend your whole life telling other people what happened. And here is someone who says what is happening, right now, and it is *me*.

"You've earned three Stamps," says Calla, turning to you. "Not bad for a beginner. The Gingerbread Games, the Beanstalk Bake-Off, the Midnight Masquerade. I've put them in your file. Would you like to see?"

She hands you a small card. It is thick, cream-colored, and edged with gold. In the corner, in a tidy hand, are three tiny round stamps: bronze, silver, silver. The edges are slightly smudged. A thumbprint is visible on one. It is yours.

"Look at that," says Calla. "Proof of life."

I look at you. You are holding the card in both hands, and your face is doing the thing that faces do when someone shows them a very small, very true piece of evidence that they are real. You have spent so long in a ledger, a ledger of numbers and letters and billions and quintillions, that you have forgotten something rather important.

You are doing things. They are *happening*. And that is enough.

"Calla," you say. "Can I ask you something?"

"Of course."

"Is it hard? Keeping track of everything?"

She looks at you. Her pencils shift in her hair.

"Honestly?" she says. "It is the easiest thing in the world. I simply write down what happened. And then I look at the page, and I think, well, that's a lot of life."

She closes the case. The room hums. A banner overhead flutters, though there is no wind, and a distant fanfare plays: the arrival of a new week, a new world, a new set of rules.

"You'd better get going," says Calla. "The Dragon Derby starts in five minutes, and the dragons are impatient."

"Do they bite?"

"Not if you're polite."

"And if I'm not?"

"They invoice."

You set off down the aisle, and I follow, and as I leave the Archive I look back at the Year Book, lying open on its cushion, with its blank page and its present tense and its patient, stubborn, everyday refusal to end.

And I think, not for the first time, about a woman who built a machine to stop time, and a woman who built a book to follow it. I think they would have liked each other. I think they might have been friends.

I think that's the saddest sentence I have ever written. I'm going to leave it there.

By the way: you will notice, reading this, that you are in a game with a button at the top that says Events. That is Calla's door. If you are ever bored, if you ever want to feel that the world is bigger than your ledger, go through it. There is always something happening. And if you play every week for a year, I am told that something extraordinary happens. I can't say what. It's in the Year Book. I haven't been allowed to read that far.

Calla says I'm "too spoilery."

She is correct.

End of Chapter Eight. (The Dragon Derby is won, by the way, by a small green dragon named Gerald. He is very proud. He is also very, very late for tea.)`
});

STORY.push({
t:'The Table That Was Round and the Forest That Was Not',
s:'Two kingdoms, one legendary sword, and an enormous quantity of passive income stolen from the rich.',
cat:'Camelot and Sherwood! Knights on one side, outlaws on the other, and you stuck in the middle holding the spreadsheet. This chapter has a sword in it. Tell no one I was nervous.',
body:`There are two kinds of heroes in the world. The first kind has a castle, a title, a round table, and an excellent public relations team. The second kind has a forest, a bow, a rather large number of friends, and a firm belief that the first kind is overcharging.

You are about to hire both.

I have to tell you that when you open Camelot and Sherwood, the ledger gives a little hiccup. It's a sound I have not heard before. It's the sound of a bookkeeper realizing that she has just agreed to employ the two most opposed organizations in the history of storytelling, at the same time, in neighboring realms, with a shared border and a very awkward history.

"Is that a problem?" you ask.

"It's an *opportunity*," I say. "Of conflict. Which is the second-oldest source of income, after bread."

We arrive in Camelot at dawn. It rises out of the mist like a wedding cake that has been to university: spires, banners, towers, crenellations, and everywhere the smell of polished armor and freshly baked scones. It is beautiful. It is organized. It is, you realize after about eleven minutes, *extremely* committed to the idea that things should be done properly.

"Welcome to the Round Table Corporation," says a knight at the gate. He is tall, bronze-haired, wearing a tabard with an enormous logo on it. The logo is a circle. "I'm Sir Lancelot. Head of Client Relations. Please sign in."

"Sign in where?"

"On the Table," says Lancelot, and leads you through the gate and into a great stone hall, and there, in the center, is the Table.

It is round. It is huge. It is polished like a mirror. A hundred and fifty chairs are arranged around its edge, and in every chair is a knight, and every knight is holding a tiny phone, and every phone is playing a different cheerful tune.

"We are very modern," says Lancelot. "We adopted the circle for equality. No head of the table. No foot. Everyone equidistant from everyone else. It was my friend Arthur's idea. He's a very good listener."

"Arthur?" you say. "The king?"

"On sabbatical," says Lancelot, a bit too quickly. "He's taking some time to himself. A retreat. Somewhere in the mist. We don't ask."

I make a face. Lancelot does not see it, because I am sitting on the shoulder of a suit of armor and I am very small and he is very busy. But I know what I know. I know that Arthur is not on sabbatical. I know that something has gone out of the room, the way a tune goes out of a song when the key is wrong. And I know what that something is.

"The sword," I say. "Where is the sword?"

Lancelot's smile does not move. It becomes slightly more fixed, like a smile painted on a shield.

"The sword is *safe*," he says.

"Safe where?"

"Safe," says Lancelot, "from interpretation."

I'd like to take a moment, if I may, to tell you about Excalibur. It is, I suppose, the most famous blade in the Ever After. It was given by a Lady in a lake, drawn from a stone, held by a king. It is said that whoever wields it cannot lose, which has been translated, over the years, as meaning "cannot lose *anything*," including arguments, fights, elections, and the last slice of pie.

The trouble is that the sword is, at the end of the day, a contract. It was never magical. It was *legal*. It has a clause. The clause is: *whoever bears this sword shall be true.* Not "shall be right." Not "shall be good." True. And there is no weapon in the world more dangerous than a thing that makes you honest.

"I'd like to see it," you say.

Lancelot's eyes flicker. For a moment you think he will refuse. Then he sighs, a long, heavy knight's sigh, and he says, "Follow me."

We go down. Down a spiral stair, past the armory, past the kitchen, past the dungeon (which has been converted into a coworking space), past a door that says STRICTLY NO WIZARDS, and into a small stone chamber, empty except for a pedestal. On the pedestal, there is a sword.

It is not glowing. It is not singing. It is just lying there, with a faint film of dust, looking tired.

"Nobody will pick it up," says Lancelot. "Nobody *dares*. The last man who did went white as a sheet and confessed to eating the king's lunch in the year 912. He's still in therapy."

"Because it makes you honest."

"Because it makes you honest," says Lancelot, and he rubs the back of his neck. "Not a thing a knight wants to be. It's bad for morale. It's bad for the brand."

You step forward. You look at the sword. And something in you, something small and steady and slightly stubborn, hums in recognition.

"May I?" you say.

"Please don't," says Lancelot.

"I'd like to try."

"It's not a good idea."

"Why not?"

Lancelot hesitates. His armor creaks. And then he says, very quietly, the truest thing he has said all day.

"Because I did something to Arthur," he says. "And I don't want you to find out what."

Nobody speaks. I stop breathing. In the distance, the Round Table hums. I know how this story goes. Everyone knows how it goes. It is the oldest story in the world, the one with the queen, and the knight, and the king, and the tragedy.

And you, bless you, do not reach for the sword.

You take off your coat. You fold it. You put it on the floor. And you sit down next to Lancelot on the cold stone, and you say, "Do you want to tell me?"

A very long silence follows. Then Lancelot puts his head in his hands, and tells you all of it. It takes forty minutes. It involves a queen who was lonely, and a king who was busy, and a knight who was loyal to both, and a Round Table that got a little too round to have a corner to cry in.

It does not end the way you expect.

"He forgave me," says Lancelot, at the end. "That's the worst part. He forgave me. He said, 'It's just a story.' And then he walked into the mist."

"He didn't mean it as a pardon," you say gently. "He meant it as a warning."

Lancelot looks up.

"The Editor," you say. "She's rewriting the old tales. Smoothing them out. Making them neat. Arthur knew that if the story ended the way it was written, with a betrayal and a battle and a broken kingdom, she would use it. She'd say, 'See? This is why stories must be controlled.' So he left. He made himself an *unfinished* king. A king who is only ever about to return."

Lancelot stares at you.

"You mean he's still out there?"

"I mean he's still *about to come back*," you say. "Which means she can't touch him. Which means he's safe."

And the sword on the pedestal, so slowly that I almost think I'm imagining it, begins to hum.

Now, you are going to leave Camelot with a new manager on staff. Sir Lancelot, Head of Client Relations, will become one of your best, and in return you will promise to keep the Round Table in business and to write, in the Year Book, in the present tense, that *Arthur is on his way*. It is a small thing. It is the kind of thing that costs nothing and means everything. And somewhere in the mist, a king puts down a cup of tea and looks up.

Now: Sherwood.

It is a short walk from Camelot to Sherwood, if you take the secret path behind the kitchens and don't mind brambles. The air changes. The stone gives way to moss. The banners vanish, and in their place there are lanterns hung in the branches, and the sound of laughter, and the smell of wood smoke and roasting something.

"Halt!" says a voice, and an arrow thuds into a tree two inches from your ear.

"That's not very welcoming," you say.

"It's a *warning* arrow," says the voice. "The welcoming arrow is next."

Out of the trees, with a bow in his hand and a grin the size of a barn, steps a lean man in a green hat. He has a feather in the hat. He has a quiver on his back. He has the swagger of someone who has been told his whole life that he is charming and has taken it entirely at face value.

"Robin Hood," says the man, with a bow. "Chief Executive Outlaw. Redistribution Specialist. Do you have anything you'd like to give to the poor?"

"I'm here to open a branch," you say.

"A *branch*," says Robin, delighted. "Of what?"

"Everything."

"Splendid!" says Robin. "I love a branch. Little John! We're being acquired!"

A very large man emerges from the bushes, carrying a very small cup of tea.

"By whom?" says Little John.

"By the lady with the ledger."

"I like her already," says Little John, and offers you the tea.

I'll tell you the secret of Sherwood. It is the same secret as the secret of Camelot, but backwards. In Camelot, everyone is certain of the rules and nobody is allowed to change them. In Sherwood, nobody is certain of anything and everybody is allowed to improvise. They share the same sky. They share the same history. They share a long-standing disagreement about who owns the deer. And the Editor, who loves order, would love to have them both.

"Here's the thing," says Robin, over a roast boar the size of a rowing boat. "I steal from the rich and give to the poor. Always have. It's a simple system."

"It's a tax," I say.

"It's a *spirited* tax," says Robin.

"You know there's a Sultan in the Bazaar who would adore you."

"I've heard," says Robin. "We exchange letters."

You look at the camp, at the little tents, at the cheerful chaos, at a fox sleeping on a fiddle and a goat eating a map. And you do the thing you do best: you think about how to make it a bit more.

"What if the poor were paid properly in the first place?" you say.

Robin pauses mid-bite.

"I'm sorry?"

"What if we paid everyone fairly? Fair wages. A share of the profits. So nobody had to be robbed because nobody was left out."

There is a very long, very peculiar silence. A leaf falls. A fox stirs.

"That's the most radical thing I've ever heard," says Robin, softly.

"It's called a salary," I say.

"We should try it."

"It's very experimental," I say.

"I *love* experiments," says Robin.

And thus, at the edge of a forest, over a half-eaten boar, the first Sherwood Credit Union is born. It will employ two hundred outlaws. It will outperform every bank in the Ever After. And it will, in the end, be the reason that Dame Strike's accountants flinch whenever the word *Sherwood* is spoken.

As we leave the forest that evening, Robin catches your sleeve.

"A word," he says. "Before you go."

"Yes?"

"I heard what you said to Lancelot," he says. "About being unfinished. About being 'about to return.'"

"You heard?"

"The forest hears everything," says Robin. "It's a very nosy place." He leans in. "I just wanted to say. We're all of us 'about to' something. I'm about to retire. I've been about to retire for six hundred years. Don't tell Marian."

"I won't."

"Good," says Robin, and winks. "Now go on. You have a long road ahead. And I've a feeling you're going to need the sword."

I look back. In the dark, over the trees, high on a hill I cannot see, I could swear I hear a faint, silver ringing: a blade, in a stone, in a quiet room, humming a tune that sounds like a name.

End of Chapter Nine. (Little John, for the record, did not need the tea. He just likes to hold something small. It makes him feel gentle.)`
});

t:'Five Hundred Shoes',
s:'Hester speaks in full sentences for the first time, and the Cat learns what it cost her to leave the notes.',
cat:'FIVE HUNDRED Glass Slippers. At this point you are less a founder and more a shoe museum. Chapter ten is about Hester. I have been avoiding it for nine chapters. Please be gentle with me. I am a cat of limited emotional range.',
body:`I have been avoiding this chapter.

I want you to know that. I have been writing around it, the way you walk around a puddle in good shoes. I have told you about pigs and gingerbread and tea and tax. I have made jokes. I have been, I think you will agree, extremely funny. And all of it, every last joke, was a way of not saying the thing I am about to say.

So. Sit down. I'll start with a fact.

You have five hundred Glass Slippers.

That is a lot of shoes. That is, in the history of the Ever After, an unprecedented number of shoes. When you took the first one from the Fairy Godmother's hand, it was a trinket. When you had twenty-five, it was a chord. And at five hundred, as you stand in the quiet of your office at the end of a very long day, the slippers do something they have never done before.

They *sing*.

Not hum. Not whisper. Sing. A full, warm, wordless chord, five hundred voices on five hundred notes, and the sound fills the room, and the lamps flicker, and the ledger on your desk opens itself to a page you have never seen.

The page is blank, except for a line of handwriting at the very top. You know the handwriting. You have seen it in the margin of every contract, every receipt, every dusty form. It is slanted and brisk and slightly smudged, the handwriting of someone who is always in a hurry and never quite sure there is time.

*Hello, my darling. If you're reading this, you've done it. I'm so proud of you I could burst. I'm sorry I'm not there. I'll explain.*

You sit down very slowly.

I move to the edge of the desk. I do not say anything. For the first time in my career, I have nothing to add.

*I should start with the thing I'm most ashamed of,* the page continues, as if the ink is moving by itself. *I didn't disappear. I left. There's a difference, and I know it matters.*

You read it aloud. I don't know whether you meant to. Your voice does that thing where it tries to be steady and fails.

*The Editor and I were friends. Did Cheshire tell you? Probably not. He's terribly proud and he hates being sentimental. We were friends for a very long time. We were the first two people to realize that the Ever After was in trouble. Stories were fraying. Characters were getting tired. The old plots were wearing thin, like carpets in a hallway. We thought: someone should do something.*

*She thought the answer was to make everything permanent. I thought the answer was to make everything renewable.*

*We argued about it for years.*

I am not looking at you. I am looking at the lamp. It's a nice lamp. It has a shade with tiny stars.

*I built Happily Ever After, Inc. as an argument. A business, of all things! Isn't that funny? A way to show that a story could end and begin again. That an ending doesn't have to be a wall. It can be a door. Every time a character finished a tale, they could walk into a new one, and the old one would still be there, fond and safe and slightly warm. A cycle. Not a stop.*

*It worked, my darling. It worked beautifully. For a while.*

*But I made a mistake.*

The slippers hum, very softly. You can feel them lean, all five hundred, toward the page.

*I was too proud of it,* the page says. *I told her it was better. I said her way was a tomb and mine was a garden. I said it in front of everyone, at the Annual Meeting, in the Great Hall, with the whole of the Ever After watching. And she looked at me, and I saw something go out of her face. I saw it go out like a lamp.*

*And the next morning, she took the pen.*

You close your eyes.

*I'm not telling you this so you'll feel sorry for her,* the page says, a little faster, as if Hester can hear your thoughts. *I'm telling you so you'll understand what you're up against. The Editor isn't a villain. She's a person who was hurt, and who decided never to be hurt again, and who has the power to make that a rule for everyone. It's the most dangerous kind of sad there is.*

*And it's partly my fault.*

*So I went away. I left you the company and the slippers and the notes. I hid in the one place she couldn't look, which is the place where a story hasn't been written yet. The Margin. If you ever wonder where I've gone, I'm in the Margin. I'm in all the places between the lines.*

*I can't come out. Not until the Press is stopped. If I step into the Text, she'll find me, and she'll finish me, and the company will fall. But I can write to you. A little. Through the slippers. Every one you collect gives me a bit more room to move.*

*That's why I made so many of them, darling. That's why I made so many.*

There is a sound in the room. It takes you a moment to realize that it is you. You are crying, quietly, the way you do when you are alone, and I am sitting next to you on the edge of the desk, not touching you, just near.

I think it's important, at this point, to tell you something about the nature of a Narrator.

We are not supposed to feel things. That is the arrangement. A Narrator tells the story; a Narrator does not *belong* to it. We stand a little to the side. We hold the lantern. We say, "And then she walked into the forest," and we do not, as a rule, walk into the forest with her.

I have been breaking that rule for a very long time.

Hester knew. She always knew. She used to say, "Cheshire, you'll never be a good Narrator. You care too much about the characters." And I would say, "That's not a flaw, that's a feature." And she would laugh and say, "I know. That's why I hired you."

I'm telling you this because the next line on the page is for me.

*Cheshire,* the page says. *I know you're there. You're always there. Stop hovering. Sit on the ledger. It's warmer.*

I sit on the ledger.

*You were right,* the page says. *About all of it. I should have listened. I should have said sorry to her. I should have walked into the Press and sat down across from her and said, "I was proud and I was wrong and I miss you." Instead I built a company. It's a very Hester thing to do.*

I make a small noise. It is not a laugh. It is not quite a sob. It is the sound a cat makes when he has been holding a particular thought for an extremely long time and someone has finally taken it out of his paws.

*Take care of the heir,* the page says. *They're better than I was. They're stubborn in the right places.*

"I am," you whisper.

*I know,* says the page. *I can hear you.*

Now I'm going to tell you something else about a Narrator. Sometimes, if you have been telling a story for long enough, the story starts to tell you back. The lines stop being yours. The characters stop being yours. And the person reading you, the one who has been sitting quietly on the other side of the page, starts to feel less like an audience and more like a friend.

I want to say a few words directly to you now, the one holding this phone, or this screen, or this very small and beautifully lit rectangle. I want to say that I know you are there. I have known for a long time. You have been tapping my words away every ten seconds, and watching the numbers climb, and wondering whether to buy the next upgrade. That is entirely correct. That is how the game is played. But I'd like to say, in this small gap between sentences, thank you for reading.

It matters. More than you know. Because here is the secret Hester wrote on that page, in the very last line, and I'm going to copy it out for you now, as accurately as I can:

*A story needs one person who is listening. That's all. One. As long as someone is listening, it cannot be erased.*

That's you.

You are the one who is listening.

The slippers hum on. The lamp flickers. The page, slowly, begins to fade, and the last thing it shows is a single line, in a different hand, a hand you do not know, tidy and upright and trembling at the edges.

*She's not wrong, you know. Hester. But neither am I. Come and see me when you're ready. I'll be at the top of the world.*

*V.*

Silence.

"Cat," you say.

"Yes."

"Did she just..."

"Yes."

"The *Editor* wrote on Hester's page."

"She's been reading over her shoulder for years," I say. "It's her one remaining vice."

You laugh, a small, wet, astonished laugh. And I laugh too, and the slippers laugh, in their way, five hundred little chimes. And in the dark of the office, in the quiet of the night, two old friends who have been fighting for a hundred years each wrote a line to the other, and neither of them knew that the other was writing.

That's the saddest thing and the most hopeful thing I know.

End of Chapter Ten. (The ledger, for the record, smells faintly of lavender. Hester always did.)`
});

STORY.push({
t:'The Mall at the Top of the Mountain',
s:'Gods, shipping delays, a labyrinth in the food court, and the most overqualified customer service department in history.',
cat:'Olympus Mall is open! Zeus has a loyalty program. Athena has opinions on your spreadsheet. Hermes will deliver this message in four to six weeks. Chapter eleven, and it is mostly about customer service.',
body:`Olympus Mall opens at ten in the morning. It has been opening at ten in the morning for three thousand years. Nobody has ever seen it close.

It sits on the very top of a mountain, above the clouds, above the weather, above anything that could reasonably be called a view. Its entrance is a pair of enormous bronze doors, and above the doors, carved in letters ten feet high, is the inscription: ALL THINGS UNDER ONE ROOF. Underneath, in smaller letters: EXCEPT REFUNDS.

"This is the part of the Ever After," I say, "where you realize that gods are just people with better lighting."

You step through the doors.

The first thing you notice is the music. A harp, somewhere, playing an extremely soothing version of a song you almost recognize. The second thing is the floor. It's polished white marble, and it is so clean you can see your own reflection, and in your reflection you notice that you have a halo. A small one. About the size of a coffee saucer. It's gone by the time you look again.

"Don't touch the fountain," I say. "It grants wishes. It does not grant them *kindly*."

The mall is arranged in concentric rings, like the rings of a tree, like the circles of a labyrinth, like a very ambitious pizza. Each ring is a different department. The Ambrosia Court. The Nectar Bar. The Lightning Bolt Outlet (SECONDS AND IRREGULARS). The Winged Sandal Emporium. The Cornucopia Bulk Store. At the very center, on a throne of glass and chrome and a surprising amount of velvet, sits the Manager.

He is large. He is bearded. He has a lightning bolt tucked behind one ear, like a pencil, and a name tag that reads ZEUS (ASK ME ABOUT OUR LOYALTY PROGRAM).

"Welcome," says Zeus. His voice is like thunder in a cathedral. "Do you have a rewards card?"

"I... no?"

"Everyone has a rewards card," says Zeus, and a lightning bolt flickers in his hand and a small laminated card appears in yours. It's gold. It says OLYMPIAN MEMBER. It is already, mysteriously, stamped nine times out of ten.

"One more purchase and you get a free thunderstorm," says Zeus.

"I'd like to open a franchise," you say.

Zeus looks down at you. The lightning bolt crackles. A chorus of tiny cherubs in the rafters stop mid-flutter.

"A *franchise*," says Zeus. He says it slowly, the way a man says "dessert." "In my mall."

"Yes."

"Of what?"

"Everything."

For a long, terrible moment, nobody breathes. Then Zeus throws back his head and laughs so loudly that a pillar cracks and a nearby store alarm goes off.

"I LIKE THIS ONE," he booms. "HERA! COME MEET THE NEW PERSON!"

You will spend the rest of the day touring the mall, accompanied by an increasingly flustered deity named Hermes, who is Head of Logistics, and who will inform you at every stop that your delivery is on its way. You will watch Athena audit a spreadsheet with a single raised eyebrow. You will hire Midas to run Accounting, on the grounds that he is excellent at making money and terrible at touching anything. You will meet Medusa, the Head of Security, who wears sunglasses, and who is the single kindest person you have encountered in months. You will lose forty-five minutes in the Labyrinth Food Court, where the Minotaur works the pretzel stand and offers a very good deal on cinnamon.

"You're doing great," says Hermes, flying past at approximately the speed of an anxious bee. "Your package has been shipped. It's currently in transit. It's currently... it's currently on a boat. It's on a boat in a different mythology."

"That doesn't sound right."

"It's an *emergent* delivery route," says Hermes.

I like Hermes. He is the only god in the mall who is visibly overworked, and the only one who says "sorry" without being asked. He wears two tiny wings on his sandals and a visible, permanent expression of deep personal apology.

At the end of the day, Athena stops you in the Wisdom Wing, a quiet, high-ceilinged gallery with books lining the walls and a single owl asleep on a lamp.

"A word," she says.

She is tall, grey-eyed, and dressed in a plain white robe with a single bronze brooch. Where the others are loud, she is exact. Where the others are warm, she is precise. She looks at you for a very long time, as though she is reading a long equation that has your face in it.

"I've reviewed your numbers," she says.

"And?"

"They are... acceptable."

"Acceptable?"

"It is the highest rating I give," says Athena. "Please do not let it go to your head."

She walks to a window. The sky beyond is the shade of old gold, and far below, so far that the whole Ever After looks like a map on a table, you can see the realms you have visited: the forest, the Bazaar, the tea party, the castle, the green wood. They are small and bright and shining.

"I know about the Press," says Athena.

You say nothing. I say nothing. The owl on the lamp opens one eye.

"The Editor visited, a long time ago," Athena says. "She asked for my counsel. She was working on the theory of narrative permanence, and she wanted a philosopher's opinion."

"What did you tell her?"

"I told her it could not be done."

"And?"

"And she said, 'Why not?'" says Athena. "And I told her the truth. I said: a story is a thing that happens *in* time. If you stop time, you do not preserve the story. You kill it. A pressed flower is not a flower. It is a record of one."

"She didn't listen."

"No," says Athena. "She said, 'A record is enough.' And she left. And I have not spoken to her since."

I feel the little bell in my chest ring, the one that rings when a narrator realizes the plot has just turned a corner.

"Is there a way to stop it?" you ask. "The Press?"

Athena turns from the window.

"There is a way to *slow* it," she says. "Every machine has a rhythm. The Press prints on the hour. Each cycle needs a final proofing, and the proofing requires a signature. The signature of the Chief Editor herself. She must sit, and read, and approve. The more stories that are in flux, the longer the proofing takes. The more variants, retellings, subversions, and sequels there are in circulation, the more she must review."

"So if I create more stories..."

"You create more *work*," says Athena. "A delay. A drag on the machine. It is not a solution. It is a stalling tactic."

"A filibuster," I say.

"A filibuster," says Athena, with the smallest curl of her lip. "Yes. The oldest form of resistance."

"How long can we hold it?"

"Not forever," says Athena. "But I am a goddess of wisdom, and I will tell you what I have learned in three thousand years. Forever is not required. You need only hold it long enough for the *next* thing to arrive."

"What's the next thing?"

She almost smiles.

"I do not know," says Athena. "That is why it is the next thing."

Behind her, in the gallery, the owl clears its throat.

"There is one more matter," says Athena. "The mountain. The one in the north, above the snow. The last place the Editor went before she took up the pen. Something happened there. Something she has never told anyone. If you want to understand her, you must go."

"The north."

"The Frostbite Kingdom," says Athena. "It is a cold place. Do not wear sandals."

I look down at my own paws, which are, I'll admit, not especially well insulated.

"I'll manage," I say.

"You will not," says Athena, and for the first time, there is warmth in her voice. "You will be cold and miserable and you will complain the entire way. And you will go anyway. That is what heroes do."

I do not say that I am not a hero. I have said it many times. It is a well-worn joke.

I say, "Yes, ma'am."

Back in the Food Court, Hermes catches up to us at last, out of breath, holding a very small box.

"Your package!" he says. "I'm so sorry. It's late."

"What is it?"

"Don't know," says Hermes. "I never look. It's the first rule of delivery."

You open it. Inside, wrapped in tissue, is a small silver key. It's old, and the bow is shaped like a snowflake, and it is warm, like it has been in someone's pocket for a very long time.

"Who sent it?" you ask.

Hermes checks the label. His face changes.

"It says... it says 'From V.'"

I do not like how my fur feels.

"She sent you a *key*," I say.

"To what?"

"I think," I say, very slowly, "to the front door."

End of Chapter Eleven. (The free thunderstorm, by the way, arrives two weeks later. It is a small one. It is shaped like a sneeze. Zeus apologizes personally.)`

STORY.push({
t:'The Girl Who Wrote Herself Out',
s:'Snow, silence, and the true story of how a kind girl with a lamp became the most feared Editor in the Ever After.',
cat:'FROSTBITE KINGDOM! It is cold. I have complained eleven times already. This chapter is the one I was most afraid of. The Editor tells her own story. I just hold the lantern. Be kind to her. I was, once.',
body:`The cold begins at the border.

It is not like the cold you know. It does not bite. It does not sting. It simply lies down on top of you, very quietly, like a heavy blanket, and says: *rest*. The air is thin and clear and tastes like pennies. The sky is the color of an old photograph. Snow falls, but it falls without sound, drifting down in great soft flakes that settle on your shoulders and do not melt.

"I want it noted," I say, "that I did not agree to this."

"You agreed in the last chapter," you say.

"I agreed *conditionally*."

"On what?"

"On not having to feel my tail."

You have a coat. I do not. Instead I am riding in your hood, wrapped in a scarf, looking like a very bad-tempered croissant.

The road to the Frostbite Kingdom is long and white and entirely empty. There are no trees. There are no birds. There is only the road, and the silver key in your pocket, which has grown warmer with every mile, until it feels like a little coal against your hip.

"Where does it lead?" you ask.

"To the top," I say. "To the highest tower in the highest castle at the top of the highest peak. It's the oldest building in the Ever After. It was the first place a story was ever written down."

"Who lives there?"

"The Snow Queen," I say. "But not for a long time."

We climb for three days. I don't complain after the first hour, because complaining takes breath, and breath, up here, is precious. The snow gets deeper. The wind rises. And at last, as the light begins to fade on the third evening, we come to a gate.

It is made of ice. It is twenty feet high, and carved all over with tiny, delicate letters, and in the center, at about the height of a person's hand, there is a keyhole in the shape of a snowflake.

You take out the key.

"Wait," I say.

You pause.

"Before you open it," I say, "I need to tell you something. I should have told you at the beginning. I should have told you in Chapter One. I put it off because I wanted you to like me."

"Cat."

"I was there," I say. "The day she took the pen."

Silence. The wind whistles through the bars of the gate.

"I was in the room. I was the one who brought her the ink."

You lower the key.

"I didn't know what she was going to do with it," I say. "I thought it was for a letter. I thought she was going to write to Hester. To apologize. She was crying. She asked for a little ink, and some paper, and a quiet place to sit. So I brought them. And I sat on the arm of her chair and I purred."

My voice is very small.

"And then she wrote one word. Just one. At the top of a blank page. I looked over her shoulder, and I read it."

"What was it?"

"*Enough,*" I say.

The word hangs in the cold air between us.

"I watched her write it. I watched her put the pen down. And I knew, in that instant, that I had made a terrible mistake. Not because of the ink. Because I had been *there*, and I hadn't *said* anything. I could have said, 'Vellum, don't.' I could have said, 'Wait.' I could have said, 'It's not enough, it's never enough, that's the point.' But I was a Narrator. And Narrators are supposed to watch."

You lay a hand on my head.

"That's why I left," I say. "That's why I let her fire me. Not because she did it. Because I let her."

I stop. I take a breath. The breath hurts, in the cold.

"So that's the secret," I say. "I'm not just your guide. I'm not just a plucky sidekick with a grin and a series of excellent puns. I'm the cat who sat on the arm of the chair. I'm part of why this is happening. And if you want to take the key back to Wonderland and never come here, I will understand."

You are quiet for a long while.

"Cheshire," you say at last.

"Yes."

"Do you want to open the gate?"

"More than anything in the world."

"Then let's open the gate," you say, and you turn the key.

The ice swings wide.

Inside, there is a courtyard. It is wide and round and perfectly still. Snow lies on it like a held breath. In the middle of the courtyard there is a single bench, and on the bench, with her back to the gate, sits a tall figure in a pale coat, with white hair, hunched over a long pen, writing.

She does not turn around.

"I wondered how long it would take you," says Dame Vellum Strike.

Her voice is thinner than I remember. Quieter. The voice of someone who has said the same thing too many times to too many people.

"Hello, Vellum," I say.

"Hello, Cheshire. You've put on weight."

"It's the scarf."

"It's always the scarf," she says, and for just a moment, I hear a smile in it.

You step forward. The snow crunches under your boots. She still does not turn.

"I am glad you came," she says. "I had not expected to be. I had thought I would feel only annoyance. But it is a long time since I had a visitor. And I find I would like, for the length of one conversation, to be understood."

"We're listening," you say.

"I know," she says. "That is what I find so difficult."

She sets down the pen.

"I was born in a book," says Dame Strike. "Did you know that? Not a famous one. A small, forgettable book about a girl who finds a lamp. I was the girl. I had one chapter, and a handful of lines, and a short, sweet ending. I found the lamp. I rubbed it. A cat appeared."

I make a noise. It is not a word.

"He asked me what I wanted. I said, 'More.' He said, 'More what?' And I said, 'More story.'"

She turns, at last.

Her face is older than I expected, and younger. It is the face of someone who has spent a very long time being tired, and who has just, for a moment, forgotten.

"I wanted to be in a longer book," says the Editor. "That was all. A bigger one. One where I'd have a second chapter. A third. Maybe a plot. But my book was short. And when it ended, I was put back on the shelf. And I waited. And no one picked me up."

She folds her hands in her lap.

"Do you know what it's like," she says, "to be a finished story? To be a closed book? To know that you had one adventure, one, and that it is over, and that no one will ever open the cover again?"

"No," you say.

"It is the loneliest thing in the world," says Dame Strike. "And I thought: this is happening to everyone. All of us. Every tale. We all end. We all go back on the shelf. And no one remembers us. And I thought, if I could just *preserve* them, if I could hold them all, if I could make sure that every story, however small, however brief, had a place that was permanent and safe and *read*..."

She stops.

"But you can't hold a story," she says, very quietly. "You can only hold a page. I know that now. I think I knew it then. But I had gone too far to stop. I had already crossed out the Tea Party's Mr. Time. I had already pressed the first wall. And once you have done a terrible thing for a good reason, the reason becomes the only thing you can look at."

The snow falls around us, silent and soft.

"I wanted to be read," says Dame Strike. "That is all I ever wanted. I wanted someone to open the cover. And what I did, instead, was build a library where no one is allowed to turn the pages."

She looks up at you. And in her eyes, in the clear, calm, unbearable blue, you see the girl with the lamp.

"What do you want from me?" you ask.

"I don't know," she says. "I have asked myself every night for a hundred years. I think I wanted you to see it. Not forgive it. Just see it."

"I see it," you say.

"Thank you," she says.

And here is the thing. The thing I did not expect. The thing I want you to remember, when you reach the end of this story, and the Press is humming, and the lights are going down.

She picks up the pen.

She holds it, for a long moment, between her thumb and finger. She looks at it the way you look at an old friend who has done you terrible harm.

"I can't stop it," says Dame Strike. "Not now. The Press has a will of its own. It has been running too long. It *believes* in what it does. But I can tell you how to get in. I can tell you where the plate is. I can tell you, if you ask me, what it will take to end it."

"Why would you help me?"

"Because I am tired of being right," says Dame Strike. "And because you have a cat who hasn't left your side. And because, in all the years since I took the pen, you are the first person who has ever said to me: *I see it*. Not *you are wrong*. Not *you are evil*. Just that."

She hands you the pen.

It is lighter than you expected.

"There is a door," she says. "In the Press. At the very bottom. It opens only from the outside, and only with a certain kind of word. A word I cannot say, because I have said too many others. A word that has to come from someone who is still, in some small way, *unfinished*."

"What word?"

"You'll know it," says Dame Strike. "When you need it. That's how the best words work."

She stands. She smooths her coat. And I see, now, what I did not see before: the red on her cuffs is not dye. It is ink. It has soaked through the cloth, and through the skin, and it runs all the way up her arms like veins.

"I'll see you at the Press," she says. "I'll be the one at the desk."

"You're coming back?" I say.

"I never left," says Dame Strike. "I have only been very quiet."

The wind lifts. The snow swirls. And then she is gone, and the bench is empty, and in your hand is a long silver pen that hums gently, like a throat clearing.

I do not say anything for a long time.

"Cheshire," you say.

"Yes?"

"Are you all right?"

I look at my paws. They are shaking. This time, it is the cold.

"No," I say. "But I think I will be."

End of Chapter Twelve. (It is, by the way, the only chapter in which I stopped joking halfway through. I wanted you to notice. I wanted you to know that I can.)`
});

STORY.push({
t:'The Sequel Clause',
s:'You write the first Sequel, the Cat reads the fine print, and a mouse finally remembers his line.',
cat:'Your first Sequel! Turn the Page, in game terms. In story terms, you just did the single most illegal thing a person can do in front of an Editor: you made a Part Two. Chapter thirteen. We are nearly at the end. I am pretending to be fine.',
body:`There is a clause.

I know, I know. There is always a clause. You've learned that by now. You have learned that in the Ever After, every wonderful thing is secretly a contract, and every contract has a small paragraph at the bottom that begins with the words "Notwithstanding the foregoing."

This one is on page nine hundred and twelve of the Founding Charter of Happily Ever After, Inc., and I have been hiding it from you, because it is too good, and I wanted to save it for the right moment.

This is the right moment.

You are sitting at your desk, in the office with the lamp and the little stars, with a silver pen in your hand that hums like a throat clearing. You have just done something that no Founder has done in a hundred years: you have turned the page.

Not a reset. Not a Happily Ever After. A *Sequel*. You took everything you had earned, every slipper, every shop, every number with its extravagant letter, and you folded it up, and you wrote on the first line of a new blank page:

*Part Two.*

And the ledger exhaled.

"Cat," you say. "What just happened?"

"Page nine hundred and twelve," I say, with enormous satisfaction. "The Sequel Clause. Section four, subsection C. 'Any Founder who has completed the full cycle of Endings may, at their sole discretion, begin the story again, and the story shall be deemed a continuation and not a repetition, and no Editor may strike it for being derivative.'"

"No Editor may strike it for being derivative," you repeat.

"It's the loophole of loopholes," I say. "The Editor's whole system is built on the idea that every story is a finished thing. A sealed unit. A closed book. But a Sequel isn't a new story. It's the *same* story, continuing. She can't finish it without finishing the first one. And she can't finish the first one without admitting that it was never over."

"So it's a trap."

"It's a *paradox*," I say. "Traps are for mice."

From somewhere in the walls, a very small voice says, "Hey."

Now, you will remember the Second Mouse on the Left. He has been waiting, patiently, inside a thousand layers of paper, for several chapters. He has had a lot of time to think. And somewhere in the course of that thinking, he has realized something.

He is *not in the wall anymore*.

He is in your office. He is standing on the corner of your desk, a small grey mouse with whiskers like pencil lines, blinking in the lamplight. He is slightly flattened on one side. He has a faint smell of printer's ink. And he is holding, in both paws, a sheet of paper that says, in a tidy hand: *DISCHARGED*.

"It worked," he says, wonderingly. "I felt it. The wall went soft. And then I was... here."

"You've been promoted," I say.

"I've been *released*," says the mouse. "There's a difference. I'm not even sure I'm allowed to be in this chapter."

"Everyone is allowed in the Sequel," you say. "That's the point."

The mouse stares at you. His whiskers tremble. And slowly, with the care of someone remembering the name of a childhood friend, he opens his mouth.

"Squeak," he says.

It is a small word. It is a very small word. But it rings through the office like a bell.

"That's it," says the mouse. "That's my line. I remember. I used to say it when Cinderella's coach went by. And the coachman would say, 'Quiet, you,' and I'd say it again, louder. I used to be so proud of it."

"It's a very good line," you say.

"It's *my* line," says the mouse, and then, quite suddenly, he begins to cry. Small, hiccupy, grateful mouse tears. I give him a handkerchief. It is a very large handkerchief. It covers him entirely.

This is the thing about a Sequel, dear reader. It is not about repeating. It is about *returning*. About going back to the people and places you left, and finding that they have grown, and so have you. Every shop in your empire is now a little wiser. Every manager has a bit more experience. Every pig and cookie and rabbit has a second chance to do it better. The numbers are bigger, yes. But that is not the point.

The point is that none of them were finished.

You look at the ledger, and you notice something strange. A new section has appeared, at the very back, on a page that was blank. It is titled QUILLS, and under it is a single entry in a small, flowing hand:

*Golden Quill (1). Earned by: Writing the Second Page.*

You reach into your pocket, and there, nestled among the slippers, is a long, golden feather. It is warm. It is light as breath. And when you hold it up to the lamp, it glows with a color you have never seen, not gold exactly, not yellow, but the color of the moment just before a sentence begins.

"A quill," you say.

"The most powerful object in the Ever After," I say. "More powerful than the Press. More powerful than the pen. The pen *ends* things. The quill *continues* them. And you can't have a Sequel without one."

"What does it do?"

"It writes the next line," I say, "even when there isn't one yet."

For a while, nobody speaks. The lamp hums. The mouse blows his nose. And I do a thing I haven't done in thirteen chapters: I sit down, properly, on the desk, and I look at you.

"I have been talking to you for a long time," I say. "I have been telling you things. I have been showing off. I have made you jokes and given you riddles and led you through the snow. And I think it is time I told you what I actually want."

"What do you want?"

"I want to stop being the Narrator," I say.

I wait for you to say something. You don't. You are looking at me with that steady, patient, infuriating way you have, and I realize that I have been waiting a very long time for someone to look at me like that.

"I'm tired," I say. "Not of you. Of the *position*. Of standing at the side. Of holding the lantern. Of saying 'and then' and 'meanwhile' and 'it was at this point that.' I want to be *in* the story. I want to say a thing and have it count. I want to make a mistake, on purpose, with my own paws, and live with it."

"You can," you say.

"I can?"

"You've been in it since the first chapter," you say. "You pushed me down a hole."

"That was... narrative convenience."

"That was *you*," you say. "That was a decision. You did it. You've been making them all along."

Something happens in my chest then. I would like to describe it, but I'm a cat, and a cat is not built to talk about this sort of thing. So I'll just say that it was warm. And it was bright. And it felt, in an odd way, like being let out of a very small box that I had been sitting in for a hundred years.

"I think," I say slowly, "that I would like to be your friend."

"I thought you already were."

"I thought so too," I say. "But I wanted to ask."

You laugh. The mouse laughs. The slippers chime.

And then, from deep beneath the office, from the foundations, from the bedrock of the Ever After itself, there comes a long, low, rising hum. It is a sound I have heard before. It is the sound of a machine drawing breath.

The lamp flickers. The pen in your hand goes warm.

"She's started the Press," I say.

"How long?" you ask.

"I don't know," I say. "A few days. A week. Maybe less."

"Then we'd better hurry."

I nod. I look at the golden quill in your hand, and the silver pen in the other, and the five hundred slippers in your pocket, and the mouse on your desk, and the page before you with its brave, brand-new first line.

*Part Two.*

"One more thing," I say.

"Yes?"

"Whatever happens at the end," I say, "I want you to know that I'm not afraid. Not for me. Not even for you. I'm afraid for the *reader*."

"What reader?"

I look at you. And then, very slowly, I look past you. Past the lamp, past the desk, past the walls, past the page itself. I look at a person who is holding a phone and reading a screen and is, at this very moment, one chapter from the end.

"Hello," I say. "You."

I don't know if you can hear me. I don't know if you've been reading these out loud or silently or in the bath. But I want you to know that I see you, and I have seen you all along, and I would like to ask you to stay.

The last chapter is going to be hard.

Don't leave before it's over.

End of Chapter Thirteen. (The mouse has been hired as Head of Dialogue. His first act was to say "Squeak" in the staff meeting. It received a standing ovation.)`
});

STORY.push({
t:'The Last Page of Happily Ever After, Inc.',
s:'Every world, every shoe, every quill. The Press hums. The door needs a word. And the Cat has one more fourth wall to break.',
cat:'THE LAST CHAPTER. You did it. Every world open. Ten Golden Quills. I am a cat of many words and I have none for this. Okay, I have a few. Read it. And then, if you like, keep playing forever. That is the secret. That was always the secret.',
body:`This is the last chapter.

I want to say that clearly, at the top, because I have spent thirteen chapters being coy, and I think we've earned a straight sentence. This is the last one. After this, the book ends.

Except, of course, that it doesn't. But we'll get there.

It is the morning of the final day. The sky above the Ever After is the color of a held breath. Every realm in your empire, the Storybook Forest, Wonderland, the Arabian Bazaar, Camelot and Sherwood, Olympus Mall, and the cold white peaks of the Frostbite Kingdom, is awake and humming. Every manager is at their post. Every pig is arguing. Every cookie is running. The Hatter is wrong about the time, deliberately, with enormous joy.

And at the end of the white road, the Press is warm.

You walk to it. Not alone. That is the part I want you to remember. Behind you, on the road, in a long, ragged, cheerful line, comes everyone you have ever hired.

Bernard the pig, with his tray of bricks. The Gingerbread Man, who has learned to walk, and is mostly walking. The Wolf, in his Huff & Puff blazer. The Hatter and the March Hare and a sleepy Dormouse in a teapot. Scheherazade, with a lantern. The Intern Genie, unpaid, still blue, now wearing a name tag that says HEAD OF WISHES (FINALLY). Calla Dar with her pockets. Sir Lancelot, carrying a sword he has finally learned to hold. Robin Hood and Little John, eating a boar. Hermes, flying in circles, out of breath. Zeus, who has brought a lightning bolt as a gift and keeps apologizing for the size of it. Athena, walking slowly, looking at nothing, thinking about everything. And right in the back, in a wheelchair of woven silver thread, pushed by a very quiet, very pleased Second Mouse on the Left, a tiny, bright-eyed old woman in a shawl.

"Hester?" you whisper.

She waves. Her hands shake. Her eyes shine.

"I couldn't miss it, my darling," she says. "I've come out of the Margin. I've come into the Text. It's a bit scratchy. But I wanted to see."

Nobody tries to stop her. Nobody could.

The Press stands before you, enormous, windowless, ringing with its patient, endless hum. The walls are warm, and covered in a thousand faces' worth of THE END. At the very bottom, where the wall meets the ground, there is a small round door. It is no larger than a cat flap. It has no handle. It has no knob. In the center, there is a single smooth place, as if something had been rubbed away.

"That's it," says Hester. "That's the door."

"I need a word," you say.

"A particular word," says Hester. "One she couldn't say."

You kneel. You put your hand on the cold, smooth patch. The hum runs up your arm like a note through a string.

I want to tell you that I know what the word is. I've spent a hundred years thinking about it. I've tried *please*. I've tried *sorry*. I've tried *once upon a time*, which is a very good word, and almost works, but not quite. I've said them all to this door, in the dark, in the cold, a thousand times, and the door has never so much as stirred.

So I do what I always do when I do not know the answer. I look at you.

And you say, very quietly: "Cat. Do you want to try?"

"I've tried."

"I know. But not like this."

I look at the door. I look at the line of friends behind me. I look at Hester, small and shining. I look at the golden quill glowing in your hand and the pen humming in the other, the one that ends things and the one that goes on.

And I think: what is the one word a Narrator can't say?

What is the word that the Editor, in all her tidy, careful, upright years, has never been able to put on a page?

I put my paw on the door, next to your hand.

"Next," I say.

Nothing happens.

"No," I say. "Not that. Hold on."

The hum stops. The silence is so large that you could fit a world in it.

"I'm going to say it differently," I say. "I'm going to say it as myself."

I take a breath. And then, for the first time in my life, in front of all of them, in front of you, in front of the reader, I say it plain.

"I don't know how this ends."

The door opens.

It is not dramatic. There is no flash. No thunder. It simply swings inward, quietly, on its tiny hinge, like a door that has been waiting for someone to be honest.

"That's the word," says Hester, softly. "*I don't know.* She couldn't say it. She's never been able to. Every ending she wrote was a certainty. And the door only opens for a question."

"I knew it," I say. "I knew it all along."

"I really didn't."

You crawl through, and I follow. The others wait outside. The tunnel is short, and low, and smells of ink. And at the other end, there is a room.

It is a small room. That is the first surprise. After all the walls and the clerks and the endless humming, you would think the heart of the Press would be vast. But it is a plain, round, cozy little study, with a single desk, a single lamp, a single chair. On the desk is a printing plate, silver and cold, etched with a single line of text. And in the chair, with her pale hands folded, sits Dame Vellum Strike.

"You came," she says.

"You told us how."

"I did." She looks tired, and a little relieved. "I thought I might lose my nerve."

The plate on the desk is humming. It is the center of everything. You can see now what it says. It is a single word, repeated, in tiny perfect letters, in rows and rows and rows.

FINIS.

"Once I press this," says Vellum, "it will not stop. Every story will be sealed. I am sorry. I have tried to find another way. I have been trying for a hundred years. But I am out of ideas."

"You're not out of ideas," you say.

"I am."

"You're out of *questions*."

Vellum looks at you. Her mouth tightens.

"What would you ask?" she says.

And you do the bravest thing I have ever seen anyone do. You pick up the golden quill, and you set it on the plate, and you ask her, simply, as one person to another:

"What happens after?"

She frowns. "After what?"

"After the Last Page. After everyone has their happy ending. After the cottage and the garden and the warm tea. What do they do the next morning?"

"They... rest."

"And the morning after that?"

"They rest."

"And the morning after that?"

Vellum opens her mouth. And closes it.

"They get up," you say gently. "They look around. They wonder what to do. And there isn't anything, because you've taken it all. And the day after that, they wonder again."

The room is very quiet.

"You wanted to be read," you say. "That's all you ever wanted. Someone to open the cover. But that's the thing, Vellum. A book only matters because someone turns the page. And a page only turns if there's another one."

The Editor stares at the plate. She stares at it for a very long time. And in her eyes, the calm, unbearable blue begins, very slowly, to move, like ice on a river in spring.

"Hester," she says. Her voice cracks. "I'm sorry."

Hester is in the doorway, leaning on the Mouse, small and fierce and very old. "I know, you stubborn thing," she says. "I'm sorry too. I should have said it a hundred years ago. I was proud. I was a fool. I missed you every single day."

"I missed you more," says Vellum.

"That's impossible," says Hester. "I'm a much better misser."

Which, I should say, it is. I am purring. I cannot help it.

The plate breaks in two.

Outside, you will learn later, the walls of the Press went soft. The clerks lost their grey. The faceless faces filled in, one by one, with the eyes and noses and crooked smiles of the characters they had been: Third Guard, Fourth Villager, Second Mouse on the Left (the one who was already free), and a thousand more, all blinking in the daylight, all asking at once, "What did I miss?"

"A great deal," says Calla Dar, cheerfully, taking out her pencil. "Let me bring you up to date."

The Press does not vanish. I want to be clear about that. It stands to this day at the end of the white road, humming softly. But it is no longer a machine for ending things. Hester and Vellum run it together. It's a library now. A proper one. The kind with an open door, and a very comfortable chair, and a sign that says PLEASE TOUCH THE BOOKS.

They fight about the filing system. Every day. It's the happiest I have ever seen them.

And you?

You go home.

You go back to the office with the stars on the lamp, and the ledger on the desk, and the quill in the drawer. You sit down. You look at the numbers. They are enormous. They are absurd. They have letters you can't pronounce. And you smile, because you know something now that you didn't know at the start.

You know that the numbers were never the point.

I'm on the windowsill. It's late. The lamp is low. And I am about to do the last thing a Narrator ever does, which is to say goodnight.

But first, I'd like to break the fourth wall one more time. I've done it so often in this book that I think the wall has stopped objecting.

Hello. You.

Yes, you. The one holding the phone. The one who has been reading this, chapter by chapter, between taps, for days or weeks or months. I don't know how long it took you to get here. I don't know what else was going on in your life. I only know that you chose to stay, and that every time you opened the book, I was a little less alone.

You held the rope. That's all. That's the whole magic. Thank you.

And now, because I am a cat, and cats are fundamentally unable to leave without one more remark:

The game is not over.

I know that is a strange thing to say at the end of a book. But look at the ledger. It's still running. The shops are still earning. The pigs are still arguing. There is a new Festival opening on Monday, and Calla has something planned for Week 31 that she refuses to explain. There are more realms than you have seen. There are more shoes than you have counted. There are Quills to write, and Sequels to start, and numbers whose names have not yet been invented.

You haven't reached the end.

You've only reached a very good place to rest.

So. Go on. Tap something. Buy something. Make a number go up. Argue with a pig. I will be here, on the windowsill, commenting.

I've always liked that part best.

  for(let k=0;k<nGup(r);k++){const c=gupC(r,k);if(!R.gup[k]&&R.cash>=c&&(!best||c<best.c))best={c,label:GUP[r][k][0],run:()=>{R.cash-=c;R.gup[k]=true;S.stat.ups++;}};}
  if(best)return best;
  let sb=null,sr=Infinity;
  R.biz.forEach((b,i)=>{
    if(r!==EV_RT&&S.slip<slipReq(i)&&b.n<1)return;
    const n=buyAmt(r,i),c=costN(r,i,n);
    if(R.cash<c-1e-9)return;
    const unit=b.n>0?profit(r,i)/b.n:B(r,i).rev;
    const payback=c/(n*unit/B(r,i).t);
    if(payback<sr){sr=payback;sb={c,label:(b.n<1?'Open ':'Buy ×'+n+' ')+RD.biz[i][2],run:()=>{R.cash-=c;const was=b.n;b.n+=n;S.stat.buys+=n;if(was<1)autoMgr(r,i,b);}};}
  });
  return sb;
}
